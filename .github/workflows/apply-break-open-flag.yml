name: Apply break-open flag beta

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-break-open-flag.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_break_open_flag.py')
          s = p.read_text()
          old = "'''    bool hapticEnabled = false;\n    const bool markerRead = readNativeBool(extras, kMarkerExtra, &marker);'''"
          new = "'''    bool hapticEnabled = false;\n    int64_t nonce = 0;\n\n    const bool markerRead = readNativeBool(extras, kMarkerExtra, &marker);'''"
          old2 = "'''    bool hapticEnabled = false;\n    bool breakOpenEnabled = false;\n    const bool markerRead = readNativeBool(extras, kMarkerExtra, &marker);'''"
          new2 = "'''    bool hapticEnabled = false;\n    bool breakOpenEnabled = false;\n    int64_t nonce = 0;\n\n    const bool markerRead = readNativeBool(extras, kMarkerExtra, &marker);'''"
          if old not in s or old2 not in s:
              raise SystemExit('normalize: expected carrier literals not found')
          p.write_text(s.replace(old, new, 1).replace(old2, new2, 1))
          PY
          python3 scripts/apply_break_open_flag.py
          rm -f scripts/apply_break_open_flag.py

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -q 'PREF_KEY_BREAK_OPEN_ENABLED' app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt
          grep -q 'swipegate_control_break_open_enabled' native/src/control_channel.cpp
          grep -q 'noInlineHook=1' native/src/back_break_probe.cpp
          grep -q 'versionName = "0.8.1-dev.11"' app/build.gradle.kts

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make break-open a flag-backed beta option"
          git push origin HEAD:dev
