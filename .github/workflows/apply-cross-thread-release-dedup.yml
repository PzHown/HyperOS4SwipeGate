name: Apply cross-thread release haptic dedup

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-cross-thread-release-dedup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_cross_thread_dedup.py
      - name: Validate
        run: |
          git diff --check
          ! grep -q 'gReleaseDedupArmed' native/src/main.cpp
          ! grep -q 'gReleaseHapticSuppressed' native/src/main.cpp
          grep -q 'gReleaseDedupTokenDeadlineMs' native/src/main.cpp
          grep -q 'reason=ready-release-token' native/src/main.cpp
          grep -q 'crossThreadSafe=1' native/src/main.cpp
          grep -q 'versionName = "0.8.1-dev.14"' app/build.gradle.kts
          grep -q 'kReadyReleaseDedupMs = 750' native/src/main.cpp
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: dedup asynchronous release haptic across threads"
          git push origin HEAD:dev
