name: Apply dev.9 patch

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_dev9.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt app/src/main/java/io/github/pzhown/hyperos4swipegate/SettingsScreen.kt native/src/control_channel.cpp native/src/log_filter.cpp native/src/main.cpp
          git commit -m "fix: enforce runtime log levels and mark haptics beta"
          git push origin HEAD:dev
