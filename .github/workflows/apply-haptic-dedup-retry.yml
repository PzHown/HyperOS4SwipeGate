name: Apply haptic dedup retry

on:
  push:
    branches: [ dev ]
    paths:
      - '.github/workflows/apply-haptic-dedup-retry.yml'
      - 'scripts/apply_haptic_dedup_retry.py'
      - 'scripts/apply_haptic_dedup_retry_v2.py'
      - 'scripts/apply_haptic_dedup_retry_v3.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_haptic_dedup_retry_v3.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/main.cpp app/build.gradle.kts
          git commit -m "fix: deduplicate and retry first haptic"
          git push origin HEAD:dev
