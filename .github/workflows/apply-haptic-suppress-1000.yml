name: Apply haptic suppress 1000ms

on:
  push:
    branches: [ dev ]
    paths:
      - '.github/workflows/apply-haptic-suppress-1000.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('native/src/main.cpp')
          text = main.read_text()
          old = 'constexpr int64_t kHapticConfirmSuppressMs = 500;'
          new = 'constexpr int64_t kHapticConfirmSuppressMs = 1000;'
          if old not in text:
              raise SystemExit('expected 500ms haptic suppress constant not found')
          main.write_text(text.replace(old, new, 1))

          build = Path('app/build.gradle.kts')
          gradle = build.read_text()
          if 'versionCode = 45' not in gradle or 'versionName = "0.8.1-dev.3"' not in gradle:
              raise SystemExit('expected dev.3 version not found')
          gradle = gradle.replace('versionCode = 45', 'versionCode = 46', 1)
          gradle = gradle.replace('versionName = "0.8.1-dev.3"', 'versionName = "0.8.1-dev.4"', 1)
          build.write_text(gradle)
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/main.cpp app/build.gradle.kts
          git commit -m "tune: extend haptic confirm dedup to 1000ms"
          git push origin HEAD:dev
