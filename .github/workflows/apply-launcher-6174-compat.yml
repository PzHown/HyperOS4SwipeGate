name: Apply Launcher 6174 Compatibility

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/apply-launcher-6174-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch native swipe hook
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/src/main.cpp")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              text = text.replace(old, new, 1)

          old_patterns = r'''constexpr uint8_t kOnSwipeProcessPatternV1[] = {
                  0xff, 0x83, 0x05, 0xd1, 0xea, 0x7b, 0x00, 0xfd,
                  0xe9, 0xa3, 0x0f, 0x6d, 0xfd, 0xfb, 0x10, 0xa9,
          };
          constexpr uint8_t kOnSwipeProcessMaskV1[] = {
                  0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff,
                  0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff,
          };

          struct PatternSpec {
              const char *name;
              const uint8_t *bytes;
              const uint8_t *mask;
              size_t size;
          };

          constexpr PatternSpec kOnSwipeProcessPatterns[] = {
                  {"8.01.02.5459-v1", kOnSwipeProcessPatternV1, kOnSwipeProcessMaskV1,
                   sizeof(kOnSwipeProcessPatternV1)},
          };

          static_assert(sizeof(kOnSwipeProcessPatternV1) == sizeof(kOnSwipeProcessMaskV1));
          static_assert(sizeof(kOnSwipeProcessPatternV1) >= kHookProbeSize);

          using OnSwipeProcessFn = void (*)(void *, bool, uint32_t, const void *, float);

          HookFunType gHookFunction = nullptr;
          UnhookFunType gUnhookFunction = nullptr;
          std::atomic<OnSwipeProcessFn> gOriginalOnSwipeProcess{nullptr};
          '''

          new_patterns = r'''constexpr uint8_t kOnSwipeProcessPatternV1[] = {
                  0xff, 0x83, 0x05, 0xd1, 0xea, 0x7b, 0x00, 0xfd,
                  0xe9, 0xa3, 0x0f, 0x6d, 0xfd, 0xfb, 0x10, 0xa9,
          };
          constexpr uint8_t kOnSwipeProcessMaskV1[] = {
                  0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff,
                  0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff,
          };

          // RELEASE-8.01.02.6174 changes both the function prologue and the ABI.
          // horizontalDistance still arrives in s0, but the two point floats that
          // used to be passed by pointer in x3 now arrive directly in s1/s2.
          // The first 16 bytes are not unique in this build, so keep 24 bytes.
          constexpr uint8_t kOnSwipeProcessPatternV2[] = {
                  0xff, 0x83, 0x04, 0xd1, 0xeb, 0x2b, 0x0a, 0x6d,
                  0xe9, 0x23, 0x0b, 0x6d, 0xfd, 0x7b, 0x0c, 0xa9,
                  0xfc, 0x6b, 0x00, 0xf9, 0xfa, 0x67, 0x0e, 0xa9,
          };
          constexpr uint8_t kOnSwipeProcessMaskV2[] = {
                  0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff,
                  0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff,
                  0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff,
          };

          enum class SwipeProcessAbi : uint8_t {
              PointPointerV1,
              InlinePointFloatsV2,
          };

          struct PatternSpec {
              const char *name;
              const uint8_t *bytes;
              const uint8_t *mask;
              size_t size;
              SwipeProcessAbi abi;
          };

          constexpr PatternSpec kOnSwipeProcessPatterns[] = {
                  {"8.01.02.5459-v1", kOnSwipeProcessPatternV1, kOnSwipeProcessMaskV1,
                   sizeof(kOnSwipeProcessPatternV1), SwipeProcessAbi::PointPointerV1},
                  {"8.01.02.6174-v2", kOnSwipeProcessPatternV2, kOnSwipeProcessMaskV2,
                   sizeof(kOnSwipeProcessPatternV2), SwipeProcessAbi::InlinePointFloatsV2},
          };

          static_assert(sizeof(kOnSwipeProcessPatternV1) == sizeof(kOnSwipeProcessMaskV1));
          static_assert(sizeof(kOnSwipeProcessPatternV1) >= kHookProbeSize);
          static_assert(sizeof(kOnSwipeProcessPatternV2) == sizeof(kOnSwipeProcessMaskV2));
          static_assert(sizeof(kOnSwipeProcessPatternV2) >= kHookProbeSize);

          using OnSwipeProcessFnV1 = void (*)(void *, bool, uint32_t, const void *, float);
          using OnSwipeProcessFnV2 = void (*)(void *, bool, uint32_t, float, float, float);

          HookFunType gHookFunction = nullptr;
          UnhookFunType gUnhookFunction = nullptr;
          std::atomic<OnSwipeProcessFnV1> gOriginalOnSwipeProcessV1{nullptr};
          std::atomic<OnSwipeProcessFnV2> gOriginalOnSwipeProcessV2{nullptr};
          '''
          replace_once(old_patterns, new_patterns, "pattern/ABI block")

          old_hook = r'''void onSwipeProcessHook(void *self, bool readyFinish, uint32_t side,
                                  const void *point, float horizontalDistancePx) {
              ActiveHookCallGuard activeGuard;

              const int configuredDp = readThresholdDp();
              const int effectiveDp = configuredDp == 0
                      ? kStockBoundaryDp
                      : std::max(configuredDp, kStockBoundaryDp);
              const int densityDpi = effectiveDp > kStockBoundaryDp ? readDensityDpi() : 0;
              const float stockBoundaryPx = densityDpi > 0 ? dpToPx(kStockBoundaryDp, densityDpi) : 0.0f;
              const float stockGuardPx = stockBoundaryPx > 1.0f ? stockBoundaryPx - 1.0f : 0.0f;
              const float userGatePx = densityDpi > 0 ? dpToPx(effectiveDp, densityDpi) : 0.0f;
              const float absDx = std::fabs(horizontalDistancePx);

              const bool delayBeyondStock = effectiveDp > kStockBoundaryDp
                      && densityDpi > 0
                      && stockGuardPx > 0.0f
                      && userGatePx > stockBoundaryPx;
              const bool userGateReached = !delayBeyondStock || absDx >= userGatePx;

              float effectiveDistancePx = horizontalDistancePx;
              bool clamped = false;

              if (delayBeyondStock && !userGateReached && absDx > stockGuardPx) {
                  effectiveDistancePx = std::copysign(stockGuardPx, horizontalDistancePx);
                  clamped = true;
                  gClampedCount.fetch_add(1, std::memory_order_relaxed);
              } else {
                  gPassthroughCount.fetch_add(1, std::memory_order_relaxed);
              }

              const int64_t now = monotonicMs();
              int64_t last = gLastSwipeLogMs.load(std::memory_order_relaxed);
              if (now - last >= 1000 && gLastSwipeLogMs.compare_exchange_strong(
                      last, now, std::memory_order_relaxed)) {
                  logLine(ANDROID_LOG_INFO,
                          "DP_GATE rawDx=%.2f effectiveDx=%.2f configuredDp=%d effectiveDp=%d densityDpi=%d userGatePx=%.2f stockBoundaryPx=%.2f guardPx=%.2f delayBeyondStock=%d gateReached=%d clamped=%d readyFinish=%d side=%u repairs=%llu",
                          horizontalDistancePx, effectiveDistancePx,
                          configuredDp, effectiveDp, densityDpi, userGatePx,
                          stockBoundaryPx, stockGuardPx,
                          delayBeyondStock ? 1 : 0, userGateReached ? 1 : 0,
                          clamped ? 1 : 0, readyFinish ? 1 : 0, side,
                          static_cast<unsigned long long>(gRepairCount.load(std::memory_order_relaxed)));
              }

              const OnSwipeProcessFn original = gOriginalOnSwipeProcess.load(std::memory_order_acquire);
              if (original != nullptr) {
                  original(self, readyFinish, side, point, effectiveDistancePx);
              }
          }
          '''

          new_hook = r'''float gateHorizontalDistance(bool readyFinish, uint32_t side,
                                       float horizontalDistancePx) {
              const int configuredDp = readThresholdDp();
              const int effectiveDp = configuredDp == 0
                      ? kStockBoundaryDp
                      : std::max(configuredDp, kStockBoundaryDp);
              const int densityDpi = effectiveDp > kStockBoundaryDp ? readDensityDpi() : 0;
              const float stockBoundaryPx = densityDpi > 0 ? dpToPx(kStockBoundaryDp, densityDpi) : 0.0f;
              const float stockGuardPx = stockBoundaryPx > 1.0f ? stockBoundaryPx - 1.0f : 0.0f;
              const float userGatePx = densityDpi > 0 ? dpToPx(effectiveDp, densityDpi) : 0.0f;
              const float absDx = std::fabs(horizontalDistancePx);

              const bool delayBeyondStock = effectiveDp > kStockBoundaryDp
                      && densityDpi > 0
                      && stockGuardPx > 0.0f
                      && userGatePx > stockBoundaryPx;
              const bool userGateReached = !delayBeyondStock || absDx >= userGatePx;

              float effectiveDistancePx = horizontalDistancePx;
              bool clamped = false;

              if (delayBeyondStock && !userGateReached && absDx > stockGuardPx) {
                  effectiveDistancePx = std::copysign(stockGuardPx, horizontalDistancePx);
                  clamped = true;
                  gClampedCount.fetch_add(1, std::memory_order_relaxed);
              } else {
                  gPassthroughCount.fetch_add(1, std::memory_order_relaxed);
              }

              const int64_t now = monotonicMs();
              int64_t last = gLastSwipeLogMs.load(std::memory_order_relaxed);
              if (now - last >= 1000 && gLastSwipeLogMs.compare_exchange_strong(
                      last, now, std::memory_order_relaxed)) {
                  logLine(ANDROID_LOG_INFO,
                          "DP_GATE rawDx=%.2f effectiveDx=%.2f configuredDp=%d effectiveDp=%d densityDpi=%d userGatePx=%.2f stockBoundaryPx=%.2f guardPx=%.2f delayBeyondStock=%d gateReached=%d clamped=%d readyFinish=%d side=%u repairs=%llu",
                          horizontalDistancePx, effectiveDistancePx,
                          configuredDp, effectiveDp, densityDpi, userGatePx,
                          stockBoundaryPx, stockGuardPx,
                          delayBeyondStock ? 1 : 0, userGateReached ? 1 : 0,
                          clamped ? 1 : 0, readyFinish ? 1 : 0, side,
                          static_cast<unsigned long long>(gRepairCount.load(std::memory_order_relaxed)));
              }

              return effectiveDistancePx;
          }

          void onSwipeProcessHookV1(void *self, bool readyFinish, uint32_t side,
                                    const void *point, float horizontalDistancePx) {
              ActiveHookCallGuard activeGuard;
              const float effectiveDistancePx = gateHorizontalDistance(
                      readyFinish, side, horizontalDistancePx);
              const OnSwipeProcessFnV1 original =
                      gOriginalOnSwipeProcessV1.load(std::memory_order_acquire);
              if (original != nullptr) {
                  original(self, readyFinish, side, point, effectiveDistancePx);
              }
          }

          void onSwipeProcessHookV2(void *self, bool readyFinish, uint32_t side,
                                    float horizontalDistancePx, float pointX, float pointY) {
              ActiveHookCallGuard activeGuard;
              const float effectiveDistancePx = gateHorizontalDistance(
                      readyFinish, side, horizontalDistancePx);
              const OnSwipeProcessFnV2 original =
                      gOriginalOnSwipeProcessV2.load(std::memory_order_acquire);
              if (original != nullptr) {
                  original(self, readyFinish, side, effectiveDistancePx, pointX, pointY);
              }
          }
          '''
          replace_once(old_hook, new_hook, "hook wrapper block")

          old_install = r'''    void *backup = nullptr;
              const int rc = gHookFunction(reinterpret_cast<void *>(target),
                                           reinterpret_cast<void *>(onSwipeProcessHook), &backup);
          '''
          new_install = r'''    void *backup = nullptr;
              void *replacement = pattern.abi == SwipeProcessAbi::InlinePointFloatsV2
                      ? reinterpret_cast<void *>(onSwipeProcessHookV2)
                      : reinterpret_cast<void *>(onSwipeProcessHookV1);
              const int rc = gHookFunction(reinterpret_cast<void *>(target), replacement, &backup);
          '''
          replace_once(old_install, new_install, "hook install dispatch")

          old_store = r'''    gOriginalOnSwipeProcess.store(reinterpret_cast<OnSwipeProcessFn>(backup),
                                                std::memory_order_release);
          '''
          new_store = r'''    gOriginalOnSwipeProcessV1.store(nullptr, std::memory_order_release);
              gOriginalOnSwipeProcessV2.store(nullptr, std::memory_order_release);
              if (pattern.abi == SwipeProcessAbi::InlinePointFloatsV2) {
                  gOriginalOnSwipeProcessV2.store(reinterpret_cast<OnSwipeProcessFnV2>(backup),
                                                   std::memory_order_release);
              } else {
                  gOriginalOnSwipeProcessV1.store(reinterpret_cast<OnSwipeProcessFnV1>(backup),
                                                   std::memory_order_release);
              }
          '''
          replace_once(old_store, new_store, "original trampoline store")

          old_clear = "    gOriginalOnSwipeProcess.store(nullptr, std::memory_order_release);\n"
          if text.count(old_clear) != 2:
              raise SystemExit(f"trampoline clear: expected 2 matches, got {text.count(old_clear)}")
          text = text.replace(
              old_clear,
              "    gOriginalOnSwipeProcessV1.store(nullptr, std::memory_order_release);\n"
              "    gOriginalOnSwipeProcessV2.store(nullptr, std::memory_order_release);\n",
          )

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          grep -n "8.01.02.6174-v2\|onSwipeProcessHookV2\|InlinePointFloatsV2" native/src/main.cpp

      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/main.cpp
          if git diff --cached --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git commit -m "fix: support launcher 8.01.02.6174 native ABI"
          git push origin HEAD:main
