name: Apply MADV_DONTNEED page guard

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-madvise-page-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply page guard
        shell: bash
        run: |
          cat > native/include/hook_page_guard.h <<'EOF'
          #pragma once

          #include "native_api.h"

          // Installs an LSPosed inline hook only after the HyperRT madvise import has
          // been guarded against MADV_DONTNEED. Returns non-zero and does not hook
          // when the guard is not ready (fail closed).
          int swipegate_install_protected_inline_hook(
                  HookFunType hookFunction,
                  void *target,
                  void *replacement,
                  void **backup);

          // Opportunistic retry used by the existing watchdog/loader paths.
          bool swipegate_page_guard_ready();
          EOF

          cat > native/src/hook_page_guard.cpp <<'EOF'
          #include "hook_page_guard.h"

          #include <android/log.h>
          #include <elf.h>
          #include <errno.h>
          #include <link.h>
          #include <sys/mman.h>
          #include <unistd.h>

          #include <array>
          #include <atomic>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <mutex>

          namespace {

          constexpr const char *kTag = "HyperOS4SwipeGateNative";
          constexpr const char *kRuntimeName = "libhyper_os_flutter.so";
          constexpr const char *kMadviseSymbol = "madvise";
          constexpr size_t kMaxLoadRanges = 16;
          constexpr size_t kMaxProtectedPages = 128;
          constexpr size_t kMaxMadviseSlots = 8;
          constexpr size_t kInlinePatchGuardSpan = 32;

          // Design adapted from MiuiBackGestureHook's Android 17 MADV_DONTNEED
          // protection. SwipeGate patches the already-loaded HyperRT GOT directly,
          // avoiding an additional LSPlt runtime dependency while preserving the same
          // narrow policy: only HyperRT madvise calls are intercepted, and only exact
          // pages containing our inline hooks are withheld from MADV_DONTNEED.

          struct Range {
              uintptr_t start = 0;
              size_t size = 0;
          };

          struct RuntimeImage {
              uintptr_t base = 0;
              const ElfW(Phdr) *phdr = nullptr;
              ElfW(Half) phnum = 0;
              std::array<Range, kMaxLoadRanges> loadRanges{};
              size_t loadRangeCount = 0;
              char path[512]{};
          };

          using MadviseFn = int (*)(void *, size_t, int);

          std::atomic<MadviseFn> gOriginalMadvise{nullptr};
          std::atomic<bool> gGuardReady{false};
          std::atomic<int64_t> gLastGuardFailureLogMs{0};
          std::atomic<uint64_t> gPreservedRanges{0};
          std::mutex gGuardInstallMutex;

          std::array<uintptr_t, kMaxProtectedPages> gProtectedPages{};
          std::atomic<size_t> gProtectedPageCount{0};
          std::atomic_flag gProtectedPageLock = ATOMIC_FLAG_INIT;

          size_t pageSize() {
              static const size_t value = [] {
                  const long queried = sysconf(_SC_PAGESIZE);
                  return queried > 0 ? static_cast<size_t>(queried) : size_t{4096};
              }();
              return value;
          }

          uintptr_t pageStart(uintptr_t address) {
              return address & ~(static_cast<uintptr_t>(pageSize()) - 1U);
          }

          int64_t monotonicMs() {
              timespec ts{};
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return static_cast<int64_t>(ts.tv_sec) * 1000LL + ts.tv_nsec / 1000000LL;
          }

          void logLine(int priority, const char *format, ...) {
              char buffer[1024]{};
              va_list args;
              va_start(args, format);
              vsnprintf(buffer, sizeof(buffer), format, args);
              va_end(args);
              __android_log_write(priority, kTag, buffer);
          }

          bool rangeContains(const Range &range, uintptr_t address, size_t size) {
              if (range.start == 0 || address < range.start || size > UINTPTR_MAX - address) return false;
              const uintptr_t end = address + size;
              return end <= range.start + range.size && end >= address;
          }

          bool imageContains(const RuntimeImage &image, uintptr_t address, size_t size) {
              for (size_t i = 0; i < image.loadRangeCount; ++i) {
                  if (rangeContains(image.loadRanges[i], address, size)) return true;
              }
              return false;
          }

          uintptr_t resolveImagePointer(const RuntimeImage &image, uintptr_t value, size_t size) {
              if (value != 0 && imageContains(image, value, size)) return value;
              if (value > UINTPTR_MAX - image.base) return 0;
              const uintptr_t rebased = image.base + value;
              return imageContains(image, rebased, size) ? rebased : 0;
          }

          int findRuntimeCallback(dl_phdr_info *info, size_t, void *opaque) {
              if (info == nullptr || info->dlpi_name == nullptr
                      || std::strstr(info->dlpi_name, kRuntimeName) == nullptr) {
                  return 0;
              }
              auto *image = static_cast<RuntimeImage *>(opaque);
              if (image->base != 0) return 0;
              image->base = static_cast<uintptr_t>(info->dlpi_addr);
              image->phdr = info->dlpi_phdr;
              image->phnum = info->dlpi_phnum;
              std::snprintf(image->path, sizeof(image->path), "%s", info->dlpi_name);
              for (ElfW(Half) i = 0; i < info->dlpi_phnum; ++i) {
                  const ElfW(Phdr) &phdr = info->dlpi_phdr[i];
                  if (phdr.p_type != PT_LOAD || phdr.p_memsz == 0
                          || image->loadRangeCount >= image->loadRanges.size()) {
                      continue;
                  }
                  image->loadRanges[image->loadRangeCount++] = {
                          image->base + static_cast<uintptr_t>(phdr.p_vaddr),
                          static_cast<size_t>(phdr.p_memsz)};
              }
              return 1;
          }

          RuntimeImage findRuntimeImage() {
              RuntimeImage image;
              dl_iterate_phdr(findRuntimeCallback, &image);
              return image;
          }

          bool addProtectedPage(uintptr_t address) {
              const uintptr_t page = pageStart(address);
              while (gProtectedPageLock.test_and_set(std::memory_order_acquire)) {
              }
              size_t count = gProtectedPageCount.load(std::memory_order_relaxed);
              for (size_t i = 0; i < count; ++i) {
                  if (gProtectedPages[i] == page) {
                      gProtectedPageLock.clear(std::memory_order_release);
                      return true;
                  }
              }
              if (count >= gProtectedPages.size()) {
                  gProtectedPageLock.clear(std::memory_order_release);
                  return false;
              }
              gProtectedPages[count] = page;
              gProtectedPageCount.store(count + 1, std::memory_order_release);
              gProtectedPageLock.clear(std::memory_order_release);
              return true;
          }

          int guardedMadvise(void *address, size_t length, int advice) {
              MadviseFn original = gOriginalMadvise.load(std::memory_order_acquire);
              if (original == nullptr) {
                  errno = ENOSYS;
                  return -1;
              }
              if (advice != MADV_DONTNEED || length == 0) {
                  return original(address, length, advice);
              }

              const uintptr_t begin = reinterpret_cast<uintptr_t>(address);
              if (begin % pageSize() != 0 || length > UINTPTR_MAX - begin) {
                  return original(address, length, advice);
              }
              const uintptr_t end = begin + length;
              uintptr_t cursor = begin;
              bool protectedFound = false;

              while (cursor < end) {
                  uintptr_t nextProtected = end;
                  const size_t count = gProtectedPageCount.load(std::memory_order_acquire);
                  for (size_t i = 0; i < count; ++i) {
                      const uintptr_t page = gProtectedPages[i];
                      if (page >= cursor && page < end && page < nextProtected) {
                          nextProtected = page;
                      }
                  }
                  if (nextProtected == end) break;
                  if (nextProtected > cursor
                          && original(reinterpret_cast<void *>(cursor), nextProtected - cursor, advice) != 0) {
                      return -1;
                  }
                  if (nextProtected > UINTPTR_MAX - pageSize()) {
                      errno = EINVAL;
                      return -1;
                  }
                  cursor = nextProtected + pageSize();
                  if (cursor > end) cursor = end;
                  protectedFound = true;
              }

              if (!protectedFound) return original(address, length, advice);
              if (cursor < end
                      && original(reinterpret_cast<void *>(cursor), end - cursor, advice) != 0) {
                  return -1;
              }

              const uint64_t count = gPreservedRanges.fetch_add(1, std::memory_order_relaxed) + 1;
              if (count <= 4 || count % 128 == 0) {
                  logLine(ANDROID_LOG_INFO,
                          "PAGE_GUARD preserved MADV_DONTNEED range=%p-%p protectedPages=%zu count=%llu",
                          address, reinterpret_cast<void *>(end),
                          gProtectedPageCount.load(std::memory_order_relaxed),
                          static_cast<unsigned long long>(count));
              }
              return 0;
          }

          int queryProtection(uintptr_t address) {
              FILE *maps = std::fopen("/proc/self/maps", "re");
              if (maps == nullptr) return 0;
              char line[768]{};
              int protection = 0;
              while (std::fgets(line, sizeof(line), maps) != nullptr) {
                  unsigned long long begin = 0;
                  unsigned long long end = 0;
                  char perms[5]{};
                  if (std::sscanf(line, "%llx-%llx %4s", &begin, &end, perms) != 3) continue;
                  if (address < begin || address >= end) continue;
                  if (perms[0] == 'r') protection |= PROT_READ;
                  if (perms[1] == 'w') protection |= PROT_WRITE;
                  if (perms[2] == 'x') protection |= PROT_EXEC;
                  break;
              }
              std::fclose(maps);
              return protection;
          }

          struct DynamicInfo {
              uintptr_t strtab = 0;
              size_t strsz = 0;
              uintptr_t symtab = 0;
              size_t syment = 0;
              uintptr_t jmprel = 0;
              size_t pltrelsz = 0;
              ElfW(Sxword) pltrel = 0;
              uintptr_t rela = 0;
              size_t relasz = 0;
          };

          bool readDynamicInfo(const RuntimeImage &image, DynamicInfo *out) {
              if (out == nullptr || image.phdr == nullptr) return false;
              const ElfW(Phdr) *dynamicPhdr = nullptr;
              for (ElfW(Half) i = 0; i < image.phnum; ++i) {
                  if (image.phdr[i].p_type == PT_DYNAMIC && image.phdr[i].p_memsz >= sizeof(ElfW(Dyn))) {
                      dynamicPhdr = &image.phdr[i];
                      break;
                  }
              }
              if (dynamicPhdr == nullptr) return false;
              const uintptr_t dynamicAddress = image.base + static_cast<uintptr_t>(dynamicPhdr->p_vaddr);
              if (!imageContains(image, dynamicAddress, static_cast<size_t>(dynamicPhdr->p_memsz))) return false;
              const auto *dynamic = reinterpret_cast<const ElfW(Dyn) *>(dynamicAddress);
              const size_t count = static_cast<size_t>(dynamicPhdr->p_memsz) / sizeof(ElfW(Dyn));
              uintptr_t strtabValue = 0, symtabValue = 0, jmprelValue = 0, relaValue = 0;
              for (size_t i = 0; i < count && dynamic[i].d_tag != DT_NULL; ++i) {
                  switch (dynamic[i].d_tag) {
                      case DT_STRTAB: strtabValue = static_cast<uintptr_t>(dynamic[i].d_un.d_ptr); break;
                      case DT_STRSZ: out->strsz = static_cast<size_t>(dynamic[i].d_un.d_val); break;
                      case DT_SYMTAB: symtabValue = static_cast<uintptr_t>(dynamic[i].d_un.d_ptr); break;
                      case DT_SYMENT: out->syment = static_cast<size_t>(dynamic[i].d_un.d_val); break;
                      case DT_JMPREL: jmprelValue = static_cast<uintptr_t>(dynamic[i].d_un.d_ptr); break;
                      case DT_PLTRELSZ: out->pltrelsz = static_cast<size_t>(dynamic[i].d_un.d_val); break;
                      case DT_PLTREL: out->pltrel = static_cast<ElfW(Sxword)>(dynamic[i].d_un.d_val); break;
                      case DT_RELA: relaValue = static_cast<uintptr_t>(dynamic[i].d_un.d_ptr); break;
                      case DT_RELASZ: out->relasz = static_cast<size_t>(dynamic[i].d_un.d_val); break;
                      default: break;
                  }
              }
              if (out->strsz == 0 || out->syment != sizeof(ElfW(Sym))) return false;
              out->strtab = resolveImagePointer(image, strtabValue, out->strsz);
              out->symtab = resolveImagePointer(image, symtabValue, sizeof(ElfW(Sym)));
              if (jmprelValue != 0 && out->pltrelsz != 0)
                  out->jmprel = resolveImagePointer(image, jmprelValue, out->pltrelsz);
              if (relaValue != 0 && out->relasz != 0)
                  out->rela = resolveImagePointer(image, relaValue, out->relasz);
              return out->strtab != 0 && out->symtab != 0;
          }

          size_t collectMadviseSlots(const RuntimeImage &image,
                                     const DynamicInfo &dynamic,
                                     std::array<uintptr_t, kMaxMadviseSlots> *slots) {
              if (slots == nullptr) return 0;
              size_t found = 0;
              auto scan = [&](uintptr_t address, size_t bytes) {
                  if (address == 0 || bytes < sizeof(ElfW(Rela))) return;
                  const size_t count = bytes / sizeof(ElfW(Rela));
                  const auto *relocations = reinterpret_cast<const ElfW(Rela) *>(address);
                  for (size_t i = 0; i < count; ++i) {
                      const size_t symbolIndex = static_cast<size_t>(ELF64_R_SYM(relocations[i].r_info));
                      if (symbolIndex > (SIZE_MAX / dynamic.syment)) continue;
                      const uintptr_t symbolAddress = dynamic.symtab + symbolIndex * dynamic.syment;
                      if (!imageContains(image, symbolAddress, sizeof(ElfW(Sym)))) continue;
                      const auto *symbol = reinterpret_cast<const ElfW(Sym) *>(symbolAddress);
                      if (symbol->st_name >= dynamic.strsz) continue;
                      const char *name = reinterpret_cast<const char *>(dynamic.strtab + symbol->st_name);
                      if (std::strcmp(name, kMadviseSymbol) != 0) continue;
                      const uintptr_t slot = resolveImagePointer(
                              image, static_cast<uintptr_t>(relocations[i].r_offset), sizeof(void *));
                      if (slot == 0) continue;
                      bool duplicate = false;
                      for (size_t j = 0; j < found; ++j) duplicate |= (*slots)[j] == slot;
                      if (duplicate) continue;
                      if (found >= slots->size()) return;
                      (*slots)[found++] = slot;
                  }
              };
              if (dynamic.jmprel != 0 && dynamic.pltrelsz != 0 && dynamic.pltrel == DT_RELA)
                  scan(dynamic.jmprel, dynamic.pltrelsz);
              if (dynamic.rela != 0 && dynamic.relasz != 0)
                  scan(dynamic.rela, dynamic.relasz);
              return found;
          }

          bool patchMadviseSlot(uintptr_t slot, void **oldValue) {
              if (oldValue == nullptr) return false;
              const int oldProtection = queryProtection(slot);
              if (oldProtection == 0) return false;
              const uintptr_t page = pageStart(slot);
              if (!addProtectedPage(slot)) return false;
              if (mprotect(reinterpret_cast<void *>(page), pageSize(), oldProtection | PROT_WRITE) != 0) {
                  return false;
              }
              auto **pointer = reinterpret_cast<void **>(slot);
              *oldValue = __atomic_load_n(pointer, __ATOMIC_ACQUIRE);
              __atomic_store_n(pointer, reinterpret_cast<void *>(guardedMadvise), __ATOMIC_RELEASE);
              const bool restored = mprotect(reinterpret_cast<void *>(page), pageSize(), oldProtection) == 0;
              return restored;
          }

          bool ensureGuardLocked() {
              if (gGuardReady.load(std::memory_order_acquire)) return true;
              const RuntimeImage image = findRuntimeImage();
              if (image.base == 0 || image.loadRangeCount == 0) return false;

              DynamicInfo dynamic;
              if (!readDynamicInfo(image, &dynamic)) return false;
              std::array<uintptr_t, kMaxMadviseSlots> slots{};
              const size_t slotCount = collectMadviseSlots(image, dynamic, &slots);
              if (slotCount == 0) return false;

              MadviseFn original = reinterpret_cast<MadviseFn>(madvise);
              if (original == nullptr) return false;
              gOriginalMadvise.store(original, std::memory_order_release);

              struct Applied {
                  uintptr_t slot = 0;
                  void *oldValue = nullptr;
              };
              std::array<Applied, kMaxMadviseSlots> applied{};
              size_t appliedCount = 0;
              for (size_t i = 0; i < slotCount; ++i) {
                  void *oldValue = nullptr;
                  if (!patchMadviseSlot(slots[i], &oldValue)) {
                      logLine(ANDROID_LOG_ERROR,
                              "PAGE_GUARD failed to patch HyperRT madvise slot=%p index=%zu/%zu failClosed=1",
                              reinterpret_cast<void *>(slots[i]), i + 1, slotCount);
                      return false;
                  }
                  applied[appliedCount++] = {slots[i], oldValue};
              }

              gGuardReady.store(true, std::memory_order_release);
              logLine(ANDROID_LOG_INFO,
                      "PAGE_GUARD ready runtime=%s base=%p madviseSlots=%zu protectedPages=%zu mode=live-got",
                      image.path, reinterpret_cast<void *>(image.base), slotCount,
                      gProtectedPageCount.load(std::memory_order_relaxed));
              return true;
          }

          bool ensureGuard() {
              if (gGuardReady.load(std::memory_order_acquire)) return true;
              std::lock_guard<std::mutex> lock(gGuardInstallMutex);
              const bool ready = ensureGuardLocked();
              if (!ready) {
                  const int64_t now = monotonicMs();
                  int64_t last = gLastGuardFailureLogMs.load(std::memory_order_relaxed);
                  if (now - last >= 2000
                          && gLastGuardFailureLogMs.compare_exchange_strong(
                                  last, now, std::memory_order_relaxed)) {
                      logLine(ANDROID_LOG_WARN,
                              "PAGE_GUARD not ready; protected inline hook deferred failClosed=1");
                  }
              }
              return ready;
          }

          }  // namespace

          bool swipegate_page_guard_ready() {
              return ensureGuard();
          }

          int swipegate_install_protected_inline_hook(
                  HookFunType hookFunction,
                  void *target,
                  void *replacement,
                  void **backup) {
              if (hookFunction == nullptr || target == nullptr || replacement == nullptr || backup == nullptr) {
                  return -EINVAL;
              }
              if (!ensureGuard()) return -EAGAIN;

              const uintptr_t begin = reinterpret_cast<uintptr_t>(target);
              if (!addProtectedPage(begin)) return -ENOSPC;
              if (begin > UINTPTR_MAX - (kInlinePatchGuardSpan - 1)) return -EOVERFLOW;
              if (!addProtectedPage(begin + kInlinePatchGuardSpan - 1)) return -ENOSPC;

              const int rc = hookFunction(target, replacement, backup);
              if (rc == 0 && *backup != nullptr) {
                  logLine(ANDROID_LOG_INFO,
                          "PAGE_GUARD protected inline hook target=%p pages=%zu",
                          target, gProtectedPageCount.load(std::memory_order_relaxed));
              }
              return rc;
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              p.write_text(s.replace(old, new, 1))

          # Wire the guard into every LSPosed inline hook site.
          replace_once(
              'native/src/main.cpp',
              '#include "control_channel.h"\n',
              '#include "control_channel.h"\n#include "hook_page_guard.h"\n',
              'main include')

          replace_once(
              'native/src/main.cpp',
              '''    const int rc = gHookFunction(\n            target, reinterpret_cast<void *>(hapticFeedbackCaptureHook), &backup);''',
              '''    const int rc = swipegate_install_protected_inline_hook(\n            gHookFunction, target, reinterpret_cast<void *>(hapticFeedbackCaptureHook), &backup);''',
              'haptic capture hook')

          replace_once(
              'native/src/main.cpp',
              '''    const int rc = gHookFunction(\n            reinterpret_cast<void *>(target),\n            reinterpret_cast<void *>(swipegate_on_back_invoke_hook), &backup);''',
              '''    const int rc = swipegate_install_protected_inline_hook(\n            gHookFunction, reinterpret_cast<void *>(target),\n            reinterpret_cast<void *>(swipegate_on_back_invoke_hook), &backup);''',
              'back invoke hook')

          replace_once(
              'native/src/main.cpp',
              '''    const int rc = gHookFunction(reinterpret_cast<void *>(target),\n                                 reinterpret_cast<void *>(swipegate_on_swipe_process_hook), &backup);''',
              '''    const int rc = swipegate_install_protected_inline_hook(\n            gHookFunction, reinterpret_cast<void *>(target),\n            reinterpret_cast<void *>(swipegate_on_swipe_process_hook), &backup);''',
              'main swipe hook')

          replace_once(
              'native/src/back_break_probe.cpp',
              '#include "control_channel.h"\n',
              '#include "control_channel.h"\n#include "hook_page_guard.h"\n',
              'break include')

          replace_once(
              'native/src/back_break_probe.cpp',
              '''    const int rc = hookFunction(reinterpret_cast<void *>(target),\n                                reinterpret_cast<void *>(mergeSupportHook), &backup);''',
              '''    const int rc = swipegate_install_protected_inline_hook(\n            hookFunction, reinterpret_cast<void *>(target),\n            reinterpret_cast<void *>(mergeSupportHook), &backup);''',
              'break merge hook')

          replace_once(
              'native/CMakeLists.txt',
              '        src/back_break_probe.cpp\n',
              '        src/back_break_probe.cpp\n        src/hook_page_guard.cpp\n',
              'cmake source')

          p = Path('app/build.gradle.kts')
          s = p.read_text()
          if 'versionCode = 54' not in s or 'versionName = "0.8.1-dev.12"' not in s:
              raise SystemExit('unexpected app version before dev.13')
          s = s.replace('versionCode = 54', 'versionCode = 55', 1)
          s = s.replace('versionName = "0.8.1-dev.12"', 'versionName = "0.8.1-dev.13"', 1)
          s = s.replace(
              '// dev.12: self-healing function-scoped break-open beta; backing flag mutation removed; startup crash fix.',
              '// dev.13: HyperRT MADV_DONTNEED page guard + self-healing hook fallback + 750 ms dedup.',
              1)
          p.write_text(s)

          Path('.github/workflows/apply-madvise-page-guard.yml').unlink()
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -q 'src/hook_page_guard.cpp' native/CMakeLists.txt
          grep -q 'swipegate_install_protected_inline_hook' native/src/main.cpp
          grep -q 'swipegate_install_protected_inline_hook' native/src/back_break_probe.cpp
          grep -q 'PAGE_GUARD ready' native/src/hook_page_guard.cpp
          grep -q 'versionName = "0.8.1-dev.13"' app/build.gradle.kts

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: protect native hook pages from HyperRT madvise cleanup"
          git push origin HEAD:dev
