name: Apply Ready haptic v2 patch

on:
  push:
    branches:
      - dev
    paths:
      - scripts/apply_ready_haptic_v2.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_ready_haptic_v2.py
      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/main.cpp native/src/swipe_hook_entry.S app/build.gradle.kts
          git commit -m "fix: add Ready haptic without changing threshold behavior"
          git push origin HEAD:dev
