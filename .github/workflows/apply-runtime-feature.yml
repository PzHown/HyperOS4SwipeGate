name: Apply runtime feature patch

on:
  push:
    branches: [ dev ]
    paths:
      - tools/apply_runtime_feature.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply source patch
        run: python3 tools/apply_runtime_feature.py

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml app/src/main/java/io/github/pzhown/hyperos4swipegate/MainActivity.kt README.md
          git commit -m "feat: validate HYOS runtime requirements"
          git push origin HEAD:dev
