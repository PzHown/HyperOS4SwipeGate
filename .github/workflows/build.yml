name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: hyperos4-swipe-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Prepare persistent signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hyperos4swipegate-release.jks"
            echo "CI_SIGNING_ENABLED=1" >> "$GITHUB_ENV"
            echo "Persistent Android signing key loaded."
          else
            echo "CI_SIGNING_ENABLED=0" >> "$GITHUB_ENV"
            echo "No persistent signing secret configured; falling back to the Gradle debug key."
          fi

      - name: Build APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/hyperos4swipegate-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify LSPosed API102 packaging
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -p "$APK" META-INF/xposed/java_init.list | grep -qx 'io.github.pzhown.hyperos4swipegate.ModuleMain'
          unzip -p "$APK" META-INF/xposed/native_init.list | grep -qx 'libhyperos4swipegate.so'
          unzip -p "$APK" META-INF/xposed/module.prop | tee module.prop
          grep -qx 'minApiVersion=102' module.prop
          grep -qx 'targetApiVersion=102' module.prop
          grep -qx 'staticScope=true' module.prop
          unzip -p "$APK" META-INF/xposed/scope.list | grep -qx 'com.miui.home'
          test "$(unzip -p "$APK" META-INF/xposed/scope.list | grep -cve '^$')" -eq 1
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libhyperos4swipegate.so'

      - name: Verify native entry and 16 KB ELF alignment
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -p "$APK" lib/arm64-v8a/libhyperos4swipegate.so > /tmp/libhyperos4swipegate.so
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          ZIPALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          "$NM" -D /tmp/libhyperos4swipegate.so | tee native-symbols.txt
          grep -q ' native_init$' native-symbols.txt
          "$READELF" -lW /tmp/libhyperos4swipegate.so | tee elf-program-headers.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('elf-program-headers.txt').read_text()
          aligns = []
          for line in text.splitlines():
              if re.match(r'^\s*LOAD\s', line):
                  m = re.search(r'(0x[0-9a-fA-F]+)\s*$', line)
                  if not m:
                      raise SystemExit(f'Could not parse LOAD alignment: {line}')
                  aligns.append(int(m.group(1), 16))
          if not aligns or any(a < 0x4000 for a in aligns):
              raise SystemExit(f'Invalid ELF LOAD alignments: {[hex(a) for a in aligns]}')
          print('ELF LOAD alignments:', [hex(a) for a in aligns])
          PY
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - name: Verify APK signing certificate
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          if [ "$CI_SIGNING_ENABLED" = "1" ]; then
            tr '[:upper:]' '[:lower:]' < apk-signing.txt | grep -q 'f7a9ef2678d55e321a01f54cef9d1c180ec4e0c87473611437a04d2d801b8f11'
            echo "Persistent signing certificate verified."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS4SwipeGate-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish debug-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HyperOS4SwipeGate-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest \
            HyperOS4SwipeGate-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "HyperOS4SwipeGate debug latest" \
            --notes "LSPosed API 102 native_init build for HyperOS 4 Launcher 8.0+. Tested on RELEASE-8.01.02.5459-260807-08242024-R and RELEASE-8.01.02.5465-260807-08262034-R. Dynamic native Pattern scan resolves the gesture hook target without relying on a fixed offset. Sidebar hold threshold range: 88-300 dp; 88 dp keeps the Xiaomi stock boundary."
