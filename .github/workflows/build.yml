name: Update 0.9.0 Release Notes

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-release-notes:
    if: contains(github.event.head_commit.message, '[release-notes-only]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update project release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit 64-0.9.0 \
            --repo PzHown/HyperOS4SwipeGate \
            --title "SwipeGate v0.9.0" \
            --notes-file RELEASE_NOTES.md \
            --prerelease=false
          gh release view 64-0.9.0 \
            --repo PzHown/HyperOS4SwipeGate \
            --json tagName,name,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, name: .name, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'

      - name: Update LSPosed release notes
        env:
          GH_TOKEN: ${{ secrets.LSPOSED_REPO_TOKEN }}
          LSPOSED_REPO: Xposed-Modules-Repo/io.github.pzhown.hyperos4swipegate
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret LSPOSED_REPO_TOKEN is required."
            exit 1
          fi
          gh release edit 64-0.9.0 \
            --repo "$LSPOSED_REPO" \
            --title "0.9.0" \
            --notes-file RELEASE_NOTES.md \
            --prerelease=false
          gh release view 64-0.9.0 \
            --repo "$LSPOSED_REPO" \
            --json tagName,name,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, name: .name, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
