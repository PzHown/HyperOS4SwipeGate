name: Diagnose build

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/diagnose-build.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Capture build output
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug > build-error.txt 2>&1
          status=$?
          echo "exit_code=$status" >> build-error.txt
          tail -n 180 build-error.txt > build-error-tail.txt
          cat build-error-tail.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-error-tail.txt
          git commit -m 'chore: capture build failure diagnostics' || true
          git push origin HEAD:dev
          exit $status
