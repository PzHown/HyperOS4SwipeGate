name: Feature compatible dev6

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/feature-compat-dev6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch_feature_compat_dev6.py
      - name: Verify diff
        run: |
          git diff --check
          grep -n 'launcher-import-feature-primary\|feature import resolved' native/src/main.cpp
          grep -n 'RSTRING_VTABLE\|duplicate nonce' native/src/control_channel.cpp
          git diff --stat
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/src/main.cpp native/src/control_channel.cpp app/build.gradle.kts
          git commit -m 'fix: resolve launcher features across compatible builds'
          git push origin HEAD:dev
