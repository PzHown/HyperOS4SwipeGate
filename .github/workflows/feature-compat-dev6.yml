          text = text.replace('versionName = "0.8.0-dev.5"', 'versionName = "0.8.0-dev.6"', 1)
          gradle.write_text(text)
          PY

          git diff --check
          grep -n 'launcher-import-feature-primary\|feature import resolved\|RSTRING_VTABLE\|duplicate nonce' native/src/main.cpp native/src/control_channel.cpp
          git diff --stat

      - name: Commit feature compatibility
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/src/main.cpp native/src/control_channel.cpp app/build.gradle.kts
          git commit -m 'fix: resolve launcher features across compatible builds'
          git push origin HEAD:dev
