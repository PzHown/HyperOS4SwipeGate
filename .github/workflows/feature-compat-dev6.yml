name: Feature compatible dev6

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/feature-compat-dev6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply feature-compatible native resolvers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('native/src/main.cpp')
          text = main.read_text()

          text = text.replace(
              'constexpr const char *kStandardHapticSymbol = "HapticFeedback_perform_haptic_feedback";\n',
              'constexpr const char *kStandardHapticSymbol = "HapticFeedback_perform_haptic_feedback";\n'
              'constexpr int64_t kHapticFeatureResolveIntervalMs = 5000;\n',
              1)

