name: Fix 0.8.0 bidirectional ready haptic

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-080-bidirectional-ready-haptic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Add haptic on both ready boundary directions
        shell: bash
        run: |
          python3 .github/scripts/patch_bidirectional_ready_haptic.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/main.cpp
          git commit -m 'fix: haptic on both ready boundary transitions'
          git push origin HEAD:dev
