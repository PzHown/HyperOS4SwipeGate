name: Fix 0.8.0 haptic arc retention

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-080-haptic-arc-retention.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Preserve captured haptic runtime across normal rehook
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('native/src/main.cpp')
          s = p.read_text()

          pattern = re.compile(
              r'(\s*gHapticCaptureHookInstalled\.store\(false, std::memory_order_release\);\n'
              r'\s*gOriginalHapticFeedback\.store\(nullptr, std::memory_order_release\);\n)'
              r'\s*gCapturedHapticArc\.store\(0, std::memory_order_release\);\n'
              r'(\s*const int unhookRc = gUnhookFunction\(targetPointer\);)'
          )
          replacement = (
              r'\1'
              '        // Same process and same target: the previously captured HapticFeedback\n'
              '        // runtime is still usable. Do not clear it during a normal watchdog rehook.\n'
              r'\2'
          )
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'normal rehook block mismatch: {n}')

          log_pattern = re.compile(
              r'(?P<indent>\s*)logLine\(ANDROID_LOG_WARN, '
              r'"HAPTIC skipped stage=%s reason=runtime-not-captured", '
              r'stage == nullptr \? "unknown" : stage\);'
          )

          def replace_log(m):
              i = m.group('indent')
              return (
                  f'{i}const char *reason = original == nullptr\n'
                  f'{i}        ? (arc < 0x10000u ? "hook-and-runtime-missing" : "hook-backup-missing")\n'
                  f'{i}        : "runtime-arc-missing";\n'
                  f'{i}logLine(ANDROID_LOG_WARN,\n'
                  f'{i}        "HAPTIC skipped stage=%s reason=%s hook=%d arc=%p",\n'
                  f'{i}        stage == nullptr ? "unknown" : stage, reason,\n'
                  f'{i}        original == nullptr ? 0 : 1, reinterpret_cast<void *>(arc));'
              )

          s, n = log_pattern.subn(replace_log, s, count=1)
          if n != 1:
              raise SystemExit(f'haptic unavailable log block mismatch: {n}')

          p.write_text(s)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/main.cpp
          git commit -m 'fix: preserve captured haptic runtime across rehook'
          git push origin HEAD:dev