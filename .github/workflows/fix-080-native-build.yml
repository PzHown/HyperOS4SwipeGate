name: Fix 0.8.0 native build

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-080-native-build.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Fix native include and explicit event wrappers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('native/src/main.cpp')
          s = p.read_text()
          old = '#include "native_api.h"\n#include "swipe_semantic_resolver.h"\n'
          new = '#include "control_channel.h"\n#include "native_api.h"\n#include "swipe_semantic_resolver.h"\n'
          if s.count(old) != 1:
              raise SystemExit('main.cpp include anchor mismatch')
          p.write_text(s.replace(old, new, 1))

          p = Path('native/src/swipe_hook_entry.S')
          s = p.read_text()
          marker = '// Haptic lifecycle hooks. Preserve opaque call arguments and forward to the LSPosed trampoline.\n'
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('haptic assembly marker not found')
          prefix = s[:idx]
          tail = '''// Haptic lifecycle hooks. Preserve opaque call arguments and forward to the LSPosed trampoline.

.global swipegate_on_swipe_start_hook
.hidden swipegate_on_swipe_start_hook
.type swipegate_on_swipe_start_hook, %function
swipegate_on_swipe_start_hook:
    sub sp, sp, #0x110
    stp x0, x1, [sp, #0x00]
    stp x2, x3, [sp, #0x10]
    stp x4, x5, [sp, #0x20]
    stp x6, x7, [sp, #0x30]
    str x8, [sp, #0x40]
    str x30, [sp, #0x48]
    stp q0, q1, [sp, #0x50]
    stp q2, q3, [sp, #0x70]
    stp q4, q5, [sp, #0x90]
    stp q6, q7, [sp, #0xb0]
    bl swipegate_haptic_on_swipe_start
    ldp q0, q1, [sp, #0x50]
    ldp q2, q3, [sp, #0x70]
    ldp q4, q5, [sp, #0x90]
    ldp q6, q7, [sp, #0xb0]
    ldp x0, x1, [sp, #0x00]
    ldp x2, x3, [sp, #0x10]
    ldp x4, x5, [sp, #0x20]
    ldp x6, x7, [sp, #0x30]
    ldr x8, [sp, #0x40]
    adrp x17, gSwipeGateOriginalOnSwipeStart
    add x17, x17, :lo12:gSwipeGateOriginalOnSwipeStart
    ldar x16, [x17]
    cbz x16, .Lswipe_start_done
    blr x16
.Lswipe_start_done:
    ldr x30, [sp, #0x48]
    add sp, sp, #0x110
    ret
.size swipegate_on_swipe_start_hook, .-swipegate_on_swipe_start_hook

.global swipegate_on_back_invoke_hook
.hidden swipegate_on_back_invoke_hook
.type swipegate_on_back_invoke_hook, %function
swipegate_on_back_invoke_hook:
    sub sp, sp, #0x110
    stp x0, x1, [sp, #0x00]
    stp x2, x3, [sp, #0x10]
    stp x4, x5, [sp, #0x20]
    stp x6, x7, [sp, #0x30]
    str x8, [sp, #0x40]
    str x30, [sp, #0x48]
    stp q0, q1, [sp, #0x50]
    stp q2, q3, [sp, #0x70]
    stp q4, q5, [sp, #0x90]
    stp q6, q7, [sp, #0xb0]
    bl swipegate_haptic_on_back_invoke
    ldp q0, q1, [sp, #0x50]
    ldp q2, q3, [sp, #0x70]
    ldp q4, q5, [sp, #0x90]
    ldp q6, q7, [sp, #0xb0]
    ldp x0, x1, [sp, #0x00]
    ldp x2, x3, [sp, #0x10]
    ldp x4, x5, [sp, #0x20]
    ldp x6, x7, [sp, #0x30]
    ldr x8, [sp, #0x40]
    adrp x17, gSwipeGateOriginalOnBackInvoke
    add x17, x17, :lo12:gSwipeGateOriginalOnBackInvoke
    ldar x16, [x17]
    cbz x16, .Lback_invoke_done
    blr x16
.Lback_invoke_done:
    ldr x30, [sp, #0x48]
    add sp, sp, #0x110
    ret
.size swipegate_on_back_invoke_hook, .-swipegate_on_back_invoke_hook

.global swipegate_on_back_cancelled_hook
.hidden swipegate_on_back_cancelled_hook
.type swipegate_on_back_cancelled_hook, %function
swipegate_on_back_cancelled_hook:
    sub sp, sp, #0x110
    stp x0, x1, [sp, #0x00]
    stp x2, x3, [sp, #0x10]
    stp x4, x5, [sp, #0x20]
    stp x6, x7, [sp, #0x30]
    str x8, [sp, #0x40]
    str x30, [sp, #0x48]
    stp q0, q1, [sp, #0x50]
    stp q2, q3, [sp, #0x70]
    stp q4, q5, [sp, #0x90]
    stp q6, q7, [sp, #0xb0]
    bl swipegate_haptic_on_back_cancelled
    ldp q0, q1, [sp, #0x50]
    ldp q2, q3, [sp, #0x70]
    ldp q4, q5, [sp, #0x90]
    ldp q6, q7, [sp, #0xb0]
    ldp x0, x1, [sp, #0x00]
    ldp x2, x3, [sp, #0x10]
    ldp x4, x5, [sp, #0x20]
    ldp x6, x7, [sp, #0x30]
    ldr x8, [sp, #0x40]
    adrp x17, gSwipeGateOriginalOnBackCancelled
    add x17, x17, :lo12:gSwipeGateOriginalOnBackCancelled
    ldar x16, [x17]
    cbz x16, .Lback_cancelled_done
    blr x16
.Lback_cancelled_done:
    ldr x30, [sp, #0x48]
    add sp, sp, #0x110
    ret
.size swipegate_on_back_cancelled_hook, .-swipegate_on_back_cancelled_hook
'''
          p.write_text(prefix + tail)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/src/main.cpp native/src/swipe_hook_entry.S
          git commit -m "fix: compile two-stage haptic hooks"
          git push origin HEAD:dev
