name: Fix 0.8.0 SystemUI haptic bridge

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-080-systemui-haptic-bridge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Route haptic execution through SystemUI
        shell: bash
        run: |
          python3 .github/scripts/patch_systemui_haptic.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/include/control_channel.h native/src/control_channel.cpp native/src/main.cpp app/src/main/java/io/github/pzhown/hyperos4swipegate/SystemUiBridgeModule.java
          git commit -m 'fix: route gesture haptics through SystemUI bridge'
          git push origin HEAD:dev