name: Fix haptic home and carrier compatibility

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-haptic-home.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          home = Path('app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt')
          text = home.read_text()
          old = 'import android.net.Uri\n'
          new = 'import android.net.Uri\nimport android.widget.Toast\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = 'import top.yukonga.miuix.kmp.preference.SliderPreference\n'
          new = 'import top.yukonga.miuix.kmp.preference.SliderPreference\nimport top.yukonga.miuix.kmp.preference.SwitchPreference\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    var thresholdDp by remember {\n        mutableFloatStateOf(\n            loadAndMigrateThresholdDp(context)\n                .coerceIn(ConfigBridge.STOCK_THRESHOLD_DP, ConfigBridge.MAX_THRESHOLD_DP)\n                .toFloat(),\n        )\n    }\n    var applyStatus by remember { mutableStateOf(\"\") }\n'''
          new = '''    var thresholdDp by remember {\n        mutableFloatStateOf(\n            loadAndMigrateThresholdDp(context)\n                .coerceIn(ConfigBridge.STOCK_THRESHOLD_DP, ConfigBridge.MAX_THRESHOLD_DP)\n                .toFloat(),\n        )\n    }\n    var hapticEnabled by remember {\n        mutableStateOf(\n            prefs.getBoolean(\n                ConfigBridge.PREF_KEY_HAPTIC_ENABLED,\n                ConfigBridge.DEFAULT_HAPTIC_ENABLED,\n            ),\n        )\n    }\n    var applyStatus by remember { mutableStateOf(\"\") }\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          anchor = '''                if (applyStatus.isNotBlank()) {\n                    Text(\n                        text = applyStatus,\n                        modifier = Modifier.padding(start = 24.dp, end = 24.dp, bottom = 18.dp),\n                        fontSize = 13.sp,\n                        color = MiuixTheme.colorScheme.error,\n                    )\n                }\n'''
          insert = anchor + '''                SwitchPreference(\n                    checked = hapticEnabled,\n                    onCheckedChange = { enabled ->\n                        hapticEnabled = enabled\n                        ConfigBridge.applyHapticEnabledAsync(context, enabled) { result ->\n                            if (!result.success()) {\n                                hapticEnabled = !enabled\n                                Toast.makeText(context, \"触感反馈同步失败\", Toast.LENGTH_SHORT).show()\n                            }\n                        }\n                    },\n                    title = \"触感反馈\",\n                    summary = if (hapticEnabled) {\n                        \"达到阈值与确认返回时提供震动反馈\"\n                    } else {\n                        \"不添加额外震动反馈\"\n                    },\n                )\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, insert, 1)
          home.write_text(text)

          settings = Path('app/src/main/java/io/github/pzhown/hyperos4swipegate/SettingsScreen.kt')
          text = settings.read_text()
          old = '    val prefs = remember { ConfigBridge.localPreferences(context) }\n'
          assert text.count(old) == 1
          text = text.replace(old, '', 1)

          old = '''    var hapticEnabled by remember {\n        mutableStateOf(prefs.getBoolean(ConfigBridge.PREF_KEY_HAPTIC_ENABLED, ConfigBridge.DEFAULT_HAPTIC_ENABLED))\n    }\n'''
          assert text.count(old) == 1
          text = text.replace(old, '', 1)

          old = '''        item { SmallTitle(\"功能\") }\n        item {\n            Card(modifier = Modifier.fillMaxWidth()) {\n                SwitchPreference(\n                    checked = hapticEnabled,\n                    onCheckedChange = { enabled ->\n                        hapticEnabled = enabled\n                        ConfigBridge.applyHapticEnabledAsync(context, enabled) { result ->\n                            if (!result.success()) {\n                                hapticEnabled = !enabled\n                                Toast.makeText(context, \"触感反馈同步失败\", Toast.LENGTH_SHORT).show()\n                            }\n                        }\n                    },\n                    title = \"触感反馈\",\n                    summary = if (hapticEnabled) \"达到阈值与确认返回时提供震动反馈\" else \"不添加额外震动反馈\",\n                )\n            }\n        }\n\n'''
          assert text.count(old) == 1
          text = text.replace(old, '', 1)
          settings.write_text(text)

          native = Path('native/src/control_channel.cpp')
          text = native.read_text()
          old = '''    bool marker = false;\n    int32_t senderUid = -1;\n    int32_t thresholdDp = -1;\n    int32_t logLevel = -1;\n    bool hapticEnabled = false;\n    int64_t nonce = 0;\n    if (!readNativeBool(extras, kMarkerExtra, &marker) || !marker\n            || !readNativeI32(extras, kSenderUidExtra, &senderUid)\n            || !readNativeI64(extras, kNonceExtra, &nonce)\n            || !readNativeI32(extras, kThresholdExtra, &thresholdDp)\n            || !readNativeI32(extras, kLogLevelExtra, &logLevel)\n            || !readNativeBool(extras, kHapticEnabledExtra, &hapticEnabled)\n            || nonce <= 0 || !verifyPackageUid(kSystemUiPackage, senderUid)\n            || thresholdDp < kMinThresholdDp || thresholdDp > kMaxThresholdDp\n            || logLevel < kMinLogLevel || logLevel > kMaxLogLevel) {\n        bridgeLog(ANDROID_LOG_WARN, \"Rejected malformed or unauthenticated SystemUI carrier\");\n        return;\n    }\n'''
          new = '''    bool marker = false;\n    int32_t senderUid = -1;\n    int32_t thresholdDp = -1;\n    int32_t logLevel = -1;\n    bool hapticEnabled = false;\n    int64_t nonce = 0;\n    const bool hapticFieldPresent = readNativeBool(extras, kHapticEnabledExtra, &hapticEnabled);\n    if (!readNativeBool(extras, kMarkerExtra, &marker) || !marker\n            || !readNativeI32(extras, kSenderUidExtra, &senderUid)\n            || !readNativeI64(extras, kNonceExtra, &nonce)\n            || !readNativeI32(extras, kThresholdExtra, &thresholdDp)\n            || !readNativeI32(extras, kLogLevelExtra, &logLevel)\n            || nonce <= 0 || !verifyPackageUid(kSystemUiPackage, senderUid)\n            || thresholdDp < kMinThresholdDp || thresholdDp > kMaxThresholdDp\n            || logLevel < kMinLogLevel || logLevel > kMaxLogLevel) {\n        bridgeLog(ANDROID_LOG_WARN, \"Rejected malformed or unauthenticated SystemUI carrier\");\n        return;\n    }\n    if (!hapticFieldPresent) {\n        {\n            SpinGuard guard;\n            hapticEnabled = gHapticEnabled == 1;\n        }\n        bridgeLog(ANDROID_LOG_WARN,\n                  \"SystemUI carrier missing haptic field; preserving previous/default state\");\n    }\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          native.write_text(text)

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          assert 'versionCode = 35' in text
          assert 'versionName = \"0.8.0-dev.3\"' in text
          text = text.replace('versionCode = 35', 'versionCode = 36', 1)
          text = text.replace('versionName = \"0.8.0-dev.3\"', 'versionName = \"0.8.0-dev.4\"', 1)
          gradle.write_text(text)
          PY

          git diff --check
          git diff -- app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt \
            app/src/main/java/io/github/pzhown/hyperos4swipegate/SettingsScreen.kt \
            native/src/control_channel.cpp app/build.gradle.kts

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt \
            app/src/main/java/io/github/pzhown/hyperos4swipegate/SettingsScreen.kt \
            native/src/control_channel.cpp app/build.gradle.kts
          git commit -m 'fix: move haptics home and tolerate bridge skew'
          git push origin HEAD:dev
