name: Fix Haptic V2 and carrier dev5

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-haptic-v2-bridge-dev5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply fix
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/src/main.cpp native/src/control_channel.cpp app/build.gradle.kts
          git commit -m 'fix: recover haptic capture and harden carrier auth'
          git push origin HEAD:dev
