          old = r'''bool installHapticCaptureHookFromHandle(void *handle) {
    if (handle == nullptr || gHookFunction == nullptr || !isLauncherProcess()) return false;
    if (gHapticCaptureHookInstalled.load(std::memory_order_acquire)) return true;

    bool expected = false;
    if (!gHapticInstallInProgress.compare_exchange_strong(
            expected, true, std::memory_order_acq_rel)) {
        return gHapticCaptureHookInstalled.load(std::memory_order_acquire);
    }

    // LSPosed's native loader callback supplies this already-loaded handle.
    // Never call dlopen/RTLD_DEFAULT here: that was the lock-order hazard in 0.8.0 v1.
    void *target = dlsym(handle, kHapticSymbol);
    void *standard = dlsym(handle, kStandardHapticSymbol);
    if (target == nullptr) {
        logLine(ANDROID_LOG_WARN,
                "HAPTIC_V2 symbol unavailable lib=%s symbol=%s handle=%p",
                kHapticLibrary, kHapticSymbol, handle);
        gHapticInstallInProgress.store(false, std::memory_order_release);
        return false;
    }

    void *backup = nullptr;
    const int rc = gHookFunction(
            target, reinterpret_cast<void *>(hapticFeedbackCaptureHook), &backup);
    if (rc != 0 || backup == nullptr) {
        logLine(ANDROID_LOG_ERROR,
                "HAPTIC_V2 capture hook failed rc=%d target=%p backup=%p",
                rc, target, backup);
        gHapticInstallInProgress.store(false, std::memory_order_release);
        return false;
    }

    gOriginalHapticFeedback.store(backup, std::memory_order_release);
    gStandardHapticFeedback.store(standard, std::memory_order_release);
    gHapticCaptureHookInstalled.store(true, std::memory_order_release);
    gHapticInstallInProgress.store(false, std::memory_order_release);
    logLine(ANDROID_LOG_INFO,
            "HAPTIC_V2 capture hook ready target=%p standard=%p policy=loader-handle-only watchdog=off",
            target, standard);
    return true;
}
'''
          new = r'''bool installHapticCaptureHookResolved(void *target, void *standard, const char *source) {
    if (target == nullptr || gHookFunction == nullptr || !isLauncherProcess()) return false;
    if (gHapticCaptureHookInstalled.load(std::memory_order_acquire)) return true;

    bool expected = false;
    if (!gHapticInstallInProgress.compare_exchange_strong(
            expected, true, std::memory_order_acq_rel)) {
        return gHapticCaptureHookInstalled.load(std::memory_order_acquire);
    }

    void *backup = nullptr;
    const int rc = gHookFunction(
            target, reinterpret_cast<void *>(hapticFeedbackCaptureHook), &backup);
    if (rc != 0 || backup == nullptr) {
        logLine(ANDROID_LOG_ERROR,
                "HAPTIC_V2 capture hook failed source=%s rc=%d target=%p backup=%p",
                source == nullptr ? "unknown" : source, rc, target, backup);
        gHapticInstallInProgress.store(false, std::memory_order_release);
        return false;
    }

    gOriginalHapticFeedback.store(backup, std::memory_order_release);
    gStandardHapticFeedback.store(standard, std::memory_order_release);
    gHapticCaptureHookInstalled.store(true, std::memory_order_release);
    gHapticInstallInProgress.store(false, std::memory_order_release);
    logLine(ANDROID_LOG_INFO,
            "HAPTIC_V2 capture hook ready source=%s target=%p standard=%p watchdog=off no-dlopen=1",
            source == nullptr ? "unknown" : source, target, standard);
    return true;
}

bool installHapticCaptureHookFromHandle(void *handle) {
    if (handle == nullptr || gHookFunction == nullptr || !isLauncherProcess()) return false;
    // The LSPosed loader callback supplies an already-loaded handle. Resolving from that exact
    // handle does not require RTLD_DEFAULT or opening another library.
    void *target = dlsym(handle, kHapticSymbol);
    void *standard = dlsym(handle, kStandardHapticSymbol);
    if (target == nullptr) {
        logLine(ANDROID_LOG_WARN,
                "HAPTIC_V2 loader symbol unavailable needle=%s symbol=%s handle=%p",
                kHapticLibraryNeedle, kHapticSymbol, handle);
        return false;
    }
    return installHapticCaptureHookResolved(target, standard, "loader-handle");
}

bool installHapticCaptureHookBackfill() {
    if (gHookFunction == nullptr || !isLauncherProcess()) return false;
    if (gHapticCaptureHookInstalled.load(std::memory_order_acquire)) return true;
    const LoadedImageInfo image = findLoadedImageInfo(kHapticLibraryNeedle);
    if (image.base == 0 || image.path.empty()) {
        logLine(ANDROID_LOG_INFO,
                "HAPTIC_V2 backfill waiting needle=%s",
                kHapticLibraryNeedle);
        return false;
    }
    void *target = resolveLoadedFileSymbol(image, kHapticSymbol);
    void *standard = resolveLoadedFileSymbol(image, kStandardHapticSymbol);
    if (target == nullptr) {
        logLine(ANDROID_LOG_WARN,
                "HAPTIC_V2 backfill symbol unavailable path=%s symbol=%s base=%p",
                image.path.c_str(), kHapticSymbol, reinterpret_cast<void *>(image.base));
        return false;
    }
    logLine(ANDROID_LOG_INFO,
            "HAPTIC_V2 backfill resolved path=%s base=%p target=%p standard=%p",
            image.path.c_str(), reinterpret_cast<void *>(image.base), target, standard);
    return installHapticCaptureHookResolved(target, standard, "elf-backfill");
}
