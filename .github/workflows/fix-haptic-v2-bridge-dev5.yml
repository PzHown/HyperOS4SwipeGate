name: Fix Haptic V2 and carrier dev5

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-haptic-v2-bridge-dev5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('native/src/main.cpp')
          text = main.read_text()

          old = 'constexpr const char *kHapticLibrary = "libhyper_os_background_tasks_public.so";\n'
          new = 'constexpr const char *kHapticLibraryNeedle = "libhyper_os_background_tasks_public";\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = '''struct LibraryInfo {\n    uintptr_t base = 0;\n    std::string path;\n    std::array<ExecutableRange, kMaxExecutableRanges> executableRanges{};\n    size_t executableRangeCount = 0;\n};\n\n'''
          insert = marker + r'''struct LoadedImageInfo {
    uintptr_t base = 0;
    std::string path;
};

struct LoadedImageSearch {
    const char *needle = nullptr;
    LoadedImageInfo result;
};

int loadedImageSearchCallback(dl_phdr_info *info, size_t, void *opaque) {
    if (info == nullptr || info->dlpi_name == nullptr || opaque == nullptr) return 0;
    auto *search = static_cast<LoadedImageSearch *>(opaque);
    const std::string path(info->dlpi_name);
    if (search->needle == nullptr || path.find(search->needle) == std::string::npos) return 0;
    search->result.base = static_cast<uintptr_t>(info->dlpi_addr);
    search->result.path = path;
    return 1;
}

LoadedImageInfo findLoadedImageInfo(const char *needle) {
    LoadedImageSearch search{needle, {}};
    dl_iterate_phdr(loadedImageSearchCallback, &search);
    return search.result;
}

bool preadExactFile(int fd, void *buffer, size_t size, off_t offset) {
    auto *bytes = static_cast<uint8_t *>(buffer);
    size_t done = 0;
    while (done < size) {
        const ssize_t result = pread(fd, bytes + done, size - done,
                                     offset + static_cast<off_t>(done));
        if (result <= 0) return false;
        done += static_cast<size_t>(result);
    }
    return true;
}

void *resolveLoadedFileSymbol(const LoadedImageInfo &image, const char *name) {
    if (image.base == 0 || image.path.empty() || name == nullptr) return nullptr;
    const int fd = open(image.path.c_str(), O_RDONLY | O_CLOEXEC);
    if (fd < 0) return nullptr;

    Elf64_Ehdr header{};
    if (!preadExactFile(fd, &header, sizeof(header), 0)
            || std::memcmp(header.e_ident, ELFMAG, SELFMAG) != 0
            || header.e_ident[EI_CLASS] != ELFCLASS64
            || header.e_machine != EM_AARCH64
            || header.e_shentsize != sizeof(Elf64_Shdr)
            || header.e_shnum == 0 || header.e_shnum > 4096) {
        close(fd);
        return nullptr;
    }

    std::vector<Elf64_Shdr> sections(header.e_shnum);
    if (!preadExactFile(fd, sections.data(), sections.size() * sizeof(Elf64_Shdr),
                        static_cast<off_t>(header.e_shoff))) {
        close(fd);
        return nullptr;
    }

    uintptr_t matchedValue = 0;
    int matches = 0;
    for (const Elf64_Shdr &symbols : sections) {
        if ((symbols.sh_type != SHT_DYNSYM && symbols.sh_type != SHT_SYMTAB)
                || symbols.sh_entsize != sizeof(Elf64_Sym)
                || symbols.sh_link >= sections.size() || symbols.sh_size == 0) continue;
        const Elf64_Shdr &strings = sections[symbols.sh_link];
        if (strings.sh_size == 0 || strings.sh_size > 64 * 1024 * 1024) continue;
        std::vector<char> stringTable(static_cast<size_t>(strings.sh_size));
        if (!preadExactFile(fd, stringTable.data(), stringTable.size(),
                            static_cast<off_t>(strings.sh_offset))) continue;
        const size_t symbolCount = static_cast<size_t>(symbols.sh_size / sizeof(Elf64_Sym));
        std::vector<Elf64_Sym> table(symbolCount);
        if (!preadExactFile(fd, table.data(), table.size() * sizeof(Elf64_Sym),
                            static_cast<off_t>(symbols.sh_offset))) continue;
        for (const Elf64_Sym &symbol : table) {
            if (symbol.st_name >= stringTable.size() || symbol.st_value == 0) continue;
            const char *candidate = stringTable.data() + symbol.st_name;
            if (std::strcmp(candidate, name) != 0) continue;
            matchedValue = static_cast<uintptr_t>(symbol.st_value);
            ++matches;
            if (matches > 1) break;
        }
        if (matches > 1) break;
    }
    close(fd);
    return matches == 1 ? reinterpret_cast<void *>(image.base + matchedValue) : nullptr;
}

