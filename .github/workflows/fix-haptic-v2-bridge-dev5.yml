    if (intent == nullptr || getExtras == nullptr
            || !intentActionEquals(intent, kCarrierAction)
            || !intentSenderEquals(intent, kSystemUiPackage)) return;

    void *extras = getExtras(intent);
    bool marker = false;
    int32_t senderUid = -1;
    int32_t thresholdDp = -1;
    int32_t logLevel = -1;
