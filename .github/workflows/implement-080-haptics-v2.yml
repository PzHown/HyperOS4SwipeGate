name: Implement 0.8.0 haptics v2

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/implement-080-haptics-v2.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch 0.8.0 two-stage back haptics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count))

          patch('app/build.gradle.kts', '        versionCode = 34\n        versionName = "0.7.2"',
                '        versionCode = 35\n        versionName = "0.8.0"')

          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/ConfigBridge.java',
                '    public static final String PREF_KEY_LOG_LEVEL = "native_log_level";\n',
                '    public static final String PREF_KEY_LOG_LEVEL = "native_log_level";\n'
                '    public static final String PREF_KEY_HAPTIC_FEEDBACK = "back_haptic_feedback";\n')
          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/ConfigBridge.java',
                '    public static final int DEFAULT_LOG_LEVEL = LOG_LEVEL_OFF;\n',
                '    public static final int DEFAULT_LOG_LEVEL = LOG_LEVEL_OFF;\n'
                '    public static final boolean DEFAULT_HAPTIC_FEEDBACK = false;\n')
          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/ConfigBridge.java',
                '    public static void applyLogLevelAsync(Context context, int logLevel, Callback callback) {\n',
                '''    public static void applyHapticFeedbackAsync(Context context, boolean enabled, Callback callback) {\n        Context app = context.getApplicationContext();\n        localPreferences(app).edit().putBoolean(PREF_KEY_HAPTIC_FEEDBACK, enabled).apply();\n        NativeControlBridge.initialize(app);\n\n        EXECUTOR.execute(() -> {\n            String message = NativeControlBridge.hasFreshPeer()\n                    ? "ok"\n                    : "已保存，Native 将在下一次桌面侧滑/心跳同步";\n            Result result = new Result(true, enabled ? 1 : 0, message);\n            MAIN.post(() -> callback.onResult(result));\n        });\n    }\n\n    public static void applyLogLevelAsync(Context context, int logLevel, Callback callback) {\n''')

          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/NativeControlBridge.java',
                '''        int logLevel = ConfigBridge.sanitizeLogLevel(\n                ConfigBridge.localPreferences(context).getInt(\n                        ConfigBridge.PREF_KEY_LOG_LEVEL,\n                        ConfigBridge.DEFAULT_LOG_LEVEL));\n\n        try {\n''',
                '''        int logLevel = ConfigBridge.sanitizeLogLevel(\n                ConfigBridge.localPreferences(context).getInt(\n                        ConfigBridge.PREF_KEY_LOG_LEVEL,\n                        ConfigBridge.DEFAULT_LOG_LEVEL));\n        boolean hapticEnabled = ConfigBridge.localPreferences(context).getBoolean(\n                ConfigBridge.PREF_KEY_HAPTIC_FEEDBACK,\n                ConfigBridge.DEFAULT_HAPTIC_FEEDBACK);\n\n        try {\n''')
          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/NativeControlBridge.java',
                '                    .putExtra(SystemUiBridgeModule.EXTRA_LOG_LEVEL, logLevel)\n',
                '                    .putExtra(SystemUiBridgeModule.EXTRA_LOG_LEVEL, logLevel)\n'
                '                    .putExtra(SystemUiBridgeModule.EXTRA_HAPTIC_ENABLED, hapticEnabled)\n')

          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/SystemUiBridgeModule.java',
                '    static final String EXTRA_LOG_LEVEL = "swipegate_log_level";\n',
                '    static final String EXTRA_LOG_LEVEL = "swipegate_log_level";\n'
                '    static final String EXTRA_HAPTIC_ENABLED = "swipegate_haptic_enabled";\n')
          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/SystemUiBridgeModule.java',
                '''            final int logLevel = intent.getIntExtra(\n                    EXTRA_LOG_LEVEL, ConfigBridge.DEFAULT_LOG_LEVEL);\n            if (nonce <= 0L\n''',
                '''            final int logLevel = intent.getIntExtra(\n                    EXTRA_LOG_LEVEL, ConfigBridge.DEFAULT_LOG_LEVEL);\n            final boolean hapticEnabled = intent.getBooleanExtra(\n                    EXTRA_HAPTIC_ENABLED, ConfigBridge.DEFAULT_HAPTIC_FEEDBACK);\n            if (nonce <= 0L\n''')
          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/SystemUiBridgeModule.java',
                '                        .putExtra(EXTRA_LOG_LEVEL, logLevel)\n',
                '                        .putExtra(EXTRA_LOG_LEVEL, logLevel)\n'
                '                        .putExtra(EXTRA_HAPTIC_ENABLED, hapticEnabled)\n', 1)

          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt',
                'import top.yukonga.miuix.kmp.preference.SliderPreference\n',
                'import top.yukonga.miuix.kmp.preference.SliderPreference\n'
                'import top.yukonga.miuix.kmp.preference.SwitchPreference\n')
          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt',
                '''    var thresholdDp by remember {\n        mutableFloatStateOf(\n            loadAndMigrateThresholdDp(context)\n                .coerceIn(ConfigBridge.STOCK_THRESHOLD_DP, ConfigBridge.MAX_THRESHOLD_DP)\n                .toFloat(),\n        )\n    }\n''',
                '''    var thresholdDp by remember {\n        mutableFloatStateOf(\n            loadAndMigrateThresholdDp(context)\n                .coerceIn(ConfigBridge.STOCK_THRESHOLD_DP, ConfigBridge.MAX_THRESHOLD_DP)\n                .toFloat(),\n        )\n    }\n    var hapticEnabled by remember {\n        mutableStateOf(\n            prefs.getBoolean(\n                ConfigBridge.PREF_KEY_HAPTIC_FEEDBACK,\n                ConfigBridge.DEFAULT_HAPTIC_FEEDBACK,\n            ),\n        )\n    }\n''')
          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt',
                '''    fun applyThreshold(appliedValue: Int) {\n        val applied = appliedValue.coerceIn(ConfigBridge.STOCK_THRESHOLD_DP, ConfigBridge.MAX_THRESHOLD_DP)\n        thresholdDp = applied.toFloat()\n        prefs.edit().putInt(ConfigBridge.PREF_KEY_THRESHOLD_DP, applied).apply()\n        ConfigBridge.applyThresholdDpAsync(context, applied) { result ->\n            applyStatus = if (!result.success()) "应用失败：${result.message()}" else ""\n        }\n    }\n\n''',
                '''    fun applyThreshold(appliedValue: Int) {\n        val applied = appliedValue.coerceIn(ConfigBridge.STOCK_THRESHOLD_DP, ConfigBridge.MAX_THRESHOLD_DP)\n        thresholdDp = applied.toFloat()\n        prefs.edit().putInt(ConfigBridge.PREF_KEY_THRESHOLD_DP, applied).apply()\n        ConfigBridge.applyThresholdDpAsync(context, applied) { result ->\n            applyStatus = if (!result.success()) "应用失败：${result.message()}" else ""\n        }\n    }\n\n    fun applyHapticFeedback(enabled: Boolean) {\n        hapticEnabled = enabled\n        ConfigBridge.applyHapticFeedbackAsync(context, enabled) { result ->\n            if (!result.success()) {\n                applyStatus = "震动反馈同步失败：${result.message()}"\n            }\n        }\n    }\n\n''')
          patch('app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt',
                '        item { SmallTitle("关于") }\n',
                '''        item {\n            Card(modifier = Modifier.fillMaxWidth()) {\n                SwitchPreference(\n                    checked = hapticEnabled,\n                    onCheckedChange = ::applyHapticFeedback,\n                    title = "返回震动反馈",\n                    summary = "达到可返回状态时震动，确认返回时再次震动",\n                )\n            }\n        }\n\n        item { SmallTitle("关于") }\n''')

          patch('native/include/control_channel.h',
