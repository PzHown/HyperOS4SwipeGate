name: Implement safe native haptic v2

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/implement-haptic-v2.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch safe native haptic v2
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:120]!r}")
              p.write_text(s.replace(old, new, count))

          # Mark this dev line as the 0.8.0 native-haptic experiment.
          patch(
              'app/build.gradle.kts',
              '        versionCode = 34\n        versionName = "0.7.2"',
              '        versionCode = 35\n        versionName = "0.8.0-dev"',
          )

          path = 'native/src/main.cpp'

          patch(path,
                '#include <elf.h>\n#include <fcntl.h>\n#include <link.h>\n',
                '#include <elf.h>\n#include <fcntl.h>\n#include <dlfcn.h>\n#include <link.h>\n')

          patch(path,
                '''__attribute__((visibility("hidden"))) void swipegate_hook_exit();\n}\n''',
                '''__attribute__((visibility("hidden"))) void swipegate_hook_exit();\n__attribute__((visibility("hidden"))) extern void *gSwipeGateOriginalOnBackInvoke;\n__attribute__((visibility("hidden"))) void swipegate_on_back_invoke_hook();\n__attribute__((visibility("hidden"))) void swipegate_haptic_on_back_invoke();\n}\n''')

          patch(path,
                '''constexpr const char *kTargetLibrary = "libapp_launcher.so";\nconstexpr const char *kThresholdDpProperty = "persist.hyperos4swipegate.threshold_dp";\n''',
                '''constexpr const char *kTargetLibrary = "libapp_launcher.so";\nconstexpr const char *kHapticLibrary = "libhyper_os_background_tasks_public.so";\nconstexpr const char *kHapticSymbol = "HapticFeedback_perform_ext_haptic_feedback";\nconstexpr const char *kStandardHapticSymbol = "HapticFeedback_perform_haptic_feedback";\nconstexpr int32_t kReadyHapticConstant = 27;\nconstexpr int32_t kCommitHapticConstant = 0;\nconstexpr uintptr_t kPointerTagMask = 0x00ffffffffffffffull;\nconstexpr const char *kThresholdDpProperty = "persist.hyperos4swipegate.threshold_dp";\n''')

          patch(path,
                '''constexpr PatternSpec kSemanticOnSwipeProcessPattern = {\n        "semantic-motion-graph", nullptr, nullptr, 0,\n};\n\nstatic_assert(sizeof(kOnSwipeProcessPatternV1) == sizeof(kOnSwipeProcessMaskV1));\n''',
                '''constexpr PatternSpec kSemanticOnSwipeProcessPattern = {\n        "semantic-motion-graph", nullptr, nullptr, 0,\n};\n\n// Known-good GestureInputBackHelper::on_back_invoke entry patterns.  These are\n// only used after the main swipe profile has already been resolved uniquely.\nconstexpr uint8_t kOnBackInvokePatternV1[] = {\n        0xff,0x83,0x05,0xd1,0xfd,0x7b,0x10,0xa9,0xfc,0x6f,0x11,0xa9,0xfa,0x67,0x12,0xa9,\n        0xf8,0x5f,0x13,0xa9,0xf6,0x57,0x14,0xa9,0xf4,0x4f,0x15,0xa9,0xfd,0x03,0x04,0x91,\n        0xf9,0x03,0x00,0xaa,0x20,0x00,0x80,0x52,\n};\nconstexpr uint8_t kOnBackInvokePatternV2[] = {\n        0xff,0x83,0x04,0xd1,0xfd,0x7b,0x0c,0xa9,0xfc,0x6f,0x0d,0xa9,0xfa,0x67,0x0e,0xa9,\n        0xf8,0x5f,0x0f,0xa9,0xf6,0x57,0x10,0xa9,0xf4,0x4f,0x11,0xa9,0xfd,0x03,0x03,0x91,\n        0xfa,0x03,0x00,0xaa,0x20,0x00,0x80,0x52,\n};\n\nstatic_assert(sizeof(kOnSwipeProcessPatternV1) == sizeof(kOnSwipeProcessMaskV1));\n''')

          patch(path,
                '''std::atomic<uint64_t> gClampedCount{0};\nstd::atomic<uint64_t> gPassthroughCount{0};\n\nstd::mutex gHookMutex;\n''',
                '''std::atomic<uint64_t> gClampedCount{0};\nstd::atomic<uint64_t> gPassthroughCount{0};\n\n// Haptic V2 is deliberately isolated from gHookMutex and the hook-health watchdog.\n// The haptic library is never dlopen'ed by this module: LSPosed gives us the handle\n// after the library is loaded and we resolve symbols exactly once from that handle.\nstd::atomic<void *> gOriginalHapticFeedback{nullptr};\nstd::atomic<void *> gStandardHapticFeedback{nullptr};\nstd::atomic<uintptr_t> gCapturedHapticArc{0};\nstd::atomic<bool> gHapticInstallInProgress{false};\nstd::atomic<bool> gHapticCaptureHookInstalled{false};\nstd::atomic<bool> gHapticUnavailableLogged{false};\nstd::atomic<bool> gReadyHapticLatched{false};\nstd::atomic<uintptr_t> gBackInvokeTarget{0};\nstd::atomic<bool> gBackInvokeHookInstalled{false};\n\nstd::mutex gHookMutex;\n''')

          helper = r'''\nusing HapticFeedbackFn = void (*)(void *, int32_t);\n\nvoid hapticFeedbackCaptureHook(void *storage, int32_t constant) {\n    if (storage != nullptr) {\n        uintptr_t arc = 0;\n        std::memcpy(&arc, storage, sizeof(arc));\n        arc &= kPointerTagMask;\n        if (arc >= 0x10000u) {\n            gCapturedHapticArc.store(arc, std::memory_order_release);\n            gHapticUnavailableLogged.store(false, std::memory_order_release);\n        }\n    }\n\n    const auto original = reinterpret_cast<HapticFeedbackFn>(\n            gOriginalHapticFeedback.load(std::memory_order_acquire));\n    if (original != nullptr) original(storage, constant);\n}\n\nbool installHapticCaptureHookFromHandle(void *handle) {\n    if (handle == nullptr || gHookFunction == nullptr || !isLauncherProcess()) return false;\n    if (gHapticCaptureHookInstalled.load(std::memory_order_acquire)) return true;\n\n    bool expected = false;\n    if (!gHapticInstallInProgress.compare_exchange_strong(\n            expected, true, std::memory_order_acq_rel)) {\n        return gHapticCaptureHookInstalled.load(std::memory_order_acquire);\n    }\n\n    // LSPosed's native loader callback supplies this already-loaded handle.\n    // Never call dlopen/RTLD_DEFAULT here: that was the lock-order hazard in 0.8.0 v1.\n    void *target = dlsym(handle, kHapticSymbol);\n    void *standard = dlsym(handle, kStandardHapticSymbol);\n    if (target == nullptr) {\n        logLine(ANDROID_LOG_WARN,\n                "HAPTIC_V2 symbol unavailable lib=%s symbol=%s handle=%p",\n                kHapticLibrary, kHapticSymbol, handle);\n        gHapticInstallInProgress.store(false, std::memory_order_release);\n        return false;\n    }\n\n    void *backup = nullptr;\n    const int rc = gHookFunction(\n            target, reinterpret_cast<void *>(hapticFeedbackCaptureHook), &backup);\n    if (rc != 0 || backup == nullptr) {\n        logLine(ANDROID_LOG_ERROR,\n                "HAPTIC_V2 capture hook failed rc=%d target=%p backup=%p",\n                rc, target, backup);\n        gHapticInstallInProgress.store(false, std::memory_order_release);\n        return false;\n    }\n\n    gOriginalHapticFeedback.store(backup, std::memory_order_release);\n    gStandardHapticFeedback.store(standard, std::memory_order_release);\n    gHapticCaptureHookInstalled.store(true, std::memory_order_release);\n    gHapticInstallInProgress.store(false, std::memory_order_release);\n    logLine(ANDROID_LOG_INFO,\n            "HAPTIC_V2 capture hook ready target=%p standard=%p policy=loader-handle-only watchdog=off",\n            target, standard);\n    return true;\n}\n\nbool performNativeHaptic(const char *stage, bool light) {\n    const auto original = reinterpret_cast<HapticFeedbackFn>(\n            gOriginalHapticFeedback.load(std::memory_order_acquire));\n    const uintptr_t arc = gCapturedHapticArc.load(std::memory_order_acquire);\n    if (original == nullptr || arc < 0x10000u) {\n        bool expected = false;\n        if (gHapticUnavailableLogged.compare_exchange_strong(expected, true)) {\n            logLine(ANDROID_LOG_WARN,\n                    "HAPTIC_V2 skipped stage=%s reason=%s hook=%d arc=%p",\n                    stage == nullptr ? "unknown" : stage,\n                    original == nullptr ? "capture-hook-not-ready" : "runtime-arc-not-captured",\n                    original == nullptr ? 0 : 1, reinterpret_cast<void *>(arc));\n        }\n        return false;\n    }\n\n    void *storage = reinterpret_cast<void *>(arc);\n    if (light) {\n        const auto standard = reinterpret_cast<HapticFeedbackFn>(\n                gStandardHapticFeedback.load(std::memory_order_acquire));\n        if (standard != nullptr) {\n            standard(&storage, kReadyHapticConstant);\n            logLine(ANDROID_LOG_INFO,\n                    "HAPTIC_V2 feedback stage=%s kind=light constant=%d",\n                    stage == nullptr ? "unknown" : stage, kReadyHapticConstant);\n            return true;\n        }\n    }\n\n    original(&storage, kCommitHapticConstant);\n    logLine(ANDROID_LOG_INFO,\n            "HAPTIC_V2 feedback stage=%s kind=%s constant=%d",\n            stage == nullptr ? "unknown" : stage, light ? "light-fallback" : "commit",\n            kCommitHapticConstant);\n    return true;\n}\n\nuintptr_t resolveUniqueAuxPattern(const LibraryInfo &library,\n                                  const uint8_t *bytes, size_t size) {\n    if (bytes == nullptr || size == 0) return 0;\n    uintptr_t found = 0;\n    for (size_t rangeIndex = 0; rangeIndex < library.executableRangeCount; ++rangeIndex) {\n        const ExecutableRange &range = library.executableRanges[rangeIndex];\n        if (range.start == 0 || range.size < size) continue;\n        const uintptr_t start = (range.start + 3u) & ~static_cast<uintptr_t>(3u);\n        const uintptr_t last = range.start + range.size - size;\n        for (uintptr_t cursor = start; cursor <= last; cursor += 4u) {\n            if (std::memcmp(reinterpret_cast<const void *>(cursor), bytes, size) != 0) continue;\n            if (found != 0 && found != cursor) return 0;\n            found = cursor;\n        }\n    }\n    return found;\n}\n\nuintptr_t resolveBackInvokeTarget(const LibraryInfo &library) {\n    if (std::strcmp(gActivePatternName, "8.01.02.5459-v1") == 0) {\n        return resolveUniqueAuxPattern(\n                library, kOnBackInvokePatternV1, sizeof(kOnBackInvokePatternV1));\n    }\n    if (std::strcmp(gActivePatternName, "8.01.02.6174-v2") == 0) {\n        return resolveUniqueAuxPattern(\n                library, kOnBackInvokePatternV2, sizeof(kOnBackInvokePatternV2));\n    }\n    return 0;\n}\n\nbool installBackInvokeHapticHook(const LibraryInfo &library) {\n    if (library.base == 0 || gHookFunction == nullptr) return false;\n    const uintptr_t target = resolveBackInvokeTarget(library);\n    if (target == 0) {\n        logLine(ANDROID_LOG_WARN,\n                "HAPTIC_V2 commit hook unresolved profile=%s; ready haptic remains available",\n                gActivePatternName);\n        return false;\n    }\n    if (gBackInvokeHookInstalled.load(std::memory_order_acquire)\n            && gBackInvokeTarget.load(std::memory_order_acquire) == target) {\n        return true;\n    }\n\n    void *backup = nullptr;\n    const int rc = gHookFunction(\n            reinterpret_cast<void *>(target),\n            reinterpret_cast<void *>(swipegate_on_back_invoke_hook), &backup);\n    if (rc != 0 || backup == nullptr) {\n        logLine(ANDROID_LOG_ERROR,\n                "HAPTIC_V2 commit hook failed rc=%d target=%p backup=%p",\n                rc, reinterpret_cast<void *>(target), backup);\n        return false;\n    }\n\n    __atomic_store_n(&gSwipeGateOriginalOnBackInvoke, backup, __ATOMIC_RELEASE);\n    gBackInvokeTarget.store(target, std::memory_order_release);\n    gBackInvokeHookInstalled.store(true, std::memory_order_release);\n    logLine(ANDROID_LOG_INFO,\n            "HAPTIC_V2 commit hook ready profile=%s target=%p watchdog=off",\n            gActivePatternName, reinterpret_cast<void *>(target));\n    return true;\n}\n'''

          patch(path,
                '''    return thresholdDp;\n}\n\nfloat gateHorizontalDistance(bool readyFinish, uint32_t side, float horizontalDistancePx) {\n''',
                '''    return thresholdDp;\n}\n''' + helper + '''\nfloat gateHorizontalDistance(bool readyFinish, uint32_t side, float horizontalDistancePx) {\n''')

          patch(path,
                '''    } else {\n        gPassthroughCount.fetch_add(1, std::memory_order_relaxed);\n    }\n\n    const int64_t now = monotonicMs();\n''',
                '''    } else {\n        gPassthroughCount.fetch_add(1, std::memory_order_relaxed);\n    }\n\n    // Custom thresholds use the custom boundary. Stock mode follows Launcher\n    // readyFinish. Trigger only on the false -> true boundary and re-arm after\n    // the gesture leaves ready state. No mutex or symbol lookup occurs here.\n    const bool hapticReady = delayBeyondStock ? userGateReached : readyFinish;\n    if (hapticReady) {\n        bool expected = false;\n        if (gReadyHapticLatched.compare_exchange_strong(\n                expected, true, std::memory_order_acq_rel)) {\n            performNativeHaptic("ready", true);\n        }\n    } else {\n        gReadyHapticLatched.store(false, std::memory_order_release);\n    }\n\n    const int64_t now = monotonicMs();\n''')

          patch(path,
                '''            probeHex(patchedHead).c_str(),\n            static_cast<unsigned long long>(gRepairCount.load(std::memory_order_relaxed)));\n    return true;\n}\n\nconst PatternSpec *findActivePattern() {\n''',
                '''            probeHex(patchedHead).c_str(),\n            static_cast<unsigned long long>(gRepairCount.load(std::memory_order_relaxed)));\n    installBackInvokeHapticHook(library);\n    return true;\n}\n\nconst PatternSpec *findActivePattern() {\n''')

          patch(path,
                '''    gActivePatternName = "<none>";\n    gActiveResolverDetail = "<none>";\n}\n\nbool ensureHookLocked''',
                '''    gActivePatternName = "<none>";\n    gActiveResolverDetail = "<none>";\n    gBackInvokeHookInstalled.store(false, std::memory_order_release);\n    gBackInvokeTarget.store(0, std::memory_order_release);\n    __atomic_store_n(&gSwipeGateOriginalOnBackInvoke, nullptr, __ATOMIC_RELEASE);\n}\n\nbool ensureHookLocked''')

          patch(path,
                '''void onLibraryLoaded(const char *name, void *) {\n    if (!isHyosSpawnerProcessFamily() || name == nullptr) return;\n    if (std::strstr(name, kTargetLibrary) != nullptr) {\n''',
                '''void onLibraryLoaded(const char *name, void *handle) {\n    if (!isHyosSpawnerProcessFamily() || name == nullptr) return;\n\n    if (std::strstr(name, kHapticLibrary) != nullptr && isLauncherProcess()) {\n        installHapticCaptureHookFromHandle(handle);\n    }\n\n    if (std::strstr(name, kTargetLibrary) != nullptr) {\n''')

          patch(path,
                '''__attribute__((visibility("hidden"))) void *gSwipeGateOriginalOnSwipeProcess = nullptr;\n\n__attribute__((visibility("hidden"))) float swipegate_hook_enter_and_gate(\n''',
                '''__attribute__((visibility("hidden"))) void *gSwipeGateOriginalOnSwipeProcess = nullptr;\n__attribute__((visibility("hidden"))) void *gSwipeGateOriginalOnBackInvoke = nullptr;\n\n__attribute__((visibility("hidden"))) float swipegate_hook_enter_and_gate(\n''')

          patch(path,
                '''__attribute__((visibility("hidden"))) void swipegate_hook_exit() {\n    gActiveHookCalls.fetch_sub(1, std::memory_order_acq_rel);\n}\n}\n''',
                '''__attribute__((visibility("hidden"))) void swipegate_hook_exit() {\n    gActiveHookCalls.fetch_sub(1, std::memory_order_acq_rel);\n}\n\n__attribute__((visibility("hidden"))) void swipegate_haptic_on_back_invoke() {\n    const bool wasReady = gReadyHapticLatched.exchange(false, std::memory_order_acq_rel);\n    if (wasReady) performNativeHaptic("commit", false);\n}\n}\n''')

          patch(path,
                '''            reinterpret_cast<void *>(entries->hook_func), reinterpret_cast<void *>(entries->unhook_func),\n            static_cast<long long>(kHookHealthIntervalMs));\n''',
                '''            reinterpret_cast<void *>(entries->hook_func), reinterpret_cast<void *>(entries->unhook_func),\n            static_cast<long long>(kHookHealthIntervalMs));\n    logLine(ANDROID_LOG_INFO,\n            "HAPTIC_V2 enabled policy=loader-handle-only no-dlopen no-watchdog no-hook-mutex ready=standard-27 commit=ext-0");\n''')

          asm = 'native/src/swipe_hook_entry.S'
          patch(asm,
                '''.size swipegate_on_swipe_process_hook, .-swipegate_on_swipe_process_hook\n''',
                '''.size swipegate_on_swipe_process_hook, .-swipegate_on_swipe_process_hook\n\n// ABI-transparent commit lifecycle hook. It only emits the haptic event and then\n// forwards the opaque call frame to the original Launcher implementation.\n.global swipegate_on_back_invoke_hook\n.hidden swipegate_on_back_invoke_hook\n.type swipegate_on_back_invoke_hook, %function\nswipegate_on_back_invoke_hook:\n    sub sp, sp, #0x110\n    stp x0, x1, [sp, #0x00]\n    stp x2, x3, [sp, #0x10]\n    stp x4, x5, [sp, #0x20]\n    stp x6, x7, [sp, #0x30]\n    str x8, [sp, #0x40]\n    str x30, [sp, #0x48]\n    stp q0, q1, [sp, #0x50]\n    stp q2, q3, [sp, #0x70]\n    stp q4, q5, [sp, #0x90]\n    stp q6, q7, [sp, #0xb0]\n    bl swipegate_haptic_on_back_invoke\n    ldp q0, q1, [sp, #0x50]\n    ldp q2, q3, [sp, #0x70]\n    ldp q4, q5, [sp, #0x90]\n    ldp q6, q7, [sp, #0xb0]\n    ldp x0, x1, [sp, #0x00]\n    ldp x2, x3, [sp, #0x10]\n    ldp x4, x5, [sp, #0x20]\n    ldp x6, x7, [sp, #0x30]\n    ldr x8, [sp, #0x40]\n    adrp x17, gSwipeGateOriginalOnBackInvoke\n    add x17, x17, :lo12:gSwipeGateOriginalOnBackInvoke\n    ldar x16, [x17]\n    cbz x16, .Lback_invoke_done\n    blr x16\n.Lback_invoke_done:\n    ldr x30, [sp, #0x48]\n    add sp, sp, #0x110\n    ret\n.size swipegate_on_back_invoke_hook, .-swipegate_on_back_invoke_hook\n''')

          # Keep the branch clean: this workflow exists only to apply the patch.
          Path('.github/workflows/implement-haptic-v2.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: reintroduce native haptics without linker lock coupling"
          git push origin dev
