name: Loaded ELF haptic dev7

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/loaded-elf-haptic-dev7.yml'
      - 'tools/patch_loaded_elf_haptic_dev7.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch_loaded_elf_haptic_dev7.py
      - name: Verify
        run: |
          git diff --check
          grep -n 'loaded-elf-dynamic-feature-primary\|loaded-elf import resolved\|gesture-frame-v2' native/src/main.cpp
          grep -n 'versionCode = 39\|versionName = "0.8.0-dev.7"' app/build.gradle.kts
          git diff --stat
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/src/main.cpp app/build.gradle.kts
          git commit -m 'fix: resolve haptic imports from loaded ELF metadata'
          git push origin HEAD:dev
