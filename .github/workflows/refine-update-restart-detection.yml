name: Refine update restart detection

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/refine-update-restart-detection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Refine update detection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          p = Path('app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt')
          text = p.read_text()

          text = replace_once(
              text,
              'private const val PREF_LAST_APP_VERSION_CODE = "last_app_version_code"',
              'private const val PREF_LAST_SEEN_UPDATE_TIME = "last_seen_app_update_time"',
              'pref key',
          )

          old = '''private fun shouldShowUpdateRestartNotice(context: Context): Boolean {
    val prefs = ConfigBridge.localPreferences(context)
    val currentVersionCode = BuildConfig.VERSION_CODE
    val previousVersionCode = prefs.getInt(PREF_LAST_APP_VERSION_CODE, 0)
    if (previousVersionCode == 0) {
        prefs.edit().putInt(PREF_LAST_APP_VERSION_CODE, currentVersionCode).apply()
        return false
    }
    if (previousVersionCode == currentVersionCode) return false

    prefs.edit().putInt(PREF_LAST_APP_VERSION_CODE, currentVersionCode).apply()
    return true
}
'''
          new = '''private fun shouldShowUpdateRestartNotice(context: Context): Boolean {
    return try {
        val info = context.packageManager.getPackageInfo(context.packageName, 0)
        val firstInstallTime = info.firstInstallTime
        val lastUpdateTime = info.lastUpdateTime
        val prefs = ConfigBridge.localPreferences(context)
        val lastSeenUpdateTime = prefs.getLong(PREF_LAST_SEEN_UPDATE_TIME, 0L)

        // Fresh install: Android reports the same install/update timestamp. Record it silently.
        // Upgrade install: lastUpdateTime moves forward while firstInstallTime stays at the
        // original installation time. This works even when the previous APK predates this
        // preference key, so the first upgrade to a build containing this detector still prompts.
        val isUpgradeInstall = lastUpdateTime > firstInstallTime
        val unseenUpgrade = isUpgradeInstall && lastSeenUpdateTime != lastUpdateTime
        if (lastSeenUpdateTime != lastUpdateTime) {
            prefs.edit().putLong(PREF_LAST_SEEN_UPDATE_TIME, lastUpdateTime).apply()
        }
        unseenUpgrade
    } catch (_: Throwable) {
        false
    }
}
'''
          text = replace_once(text, old, new, 'update detector')
          p.write_text(text)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          g = replace_once(g, 'versionCode = 48', 'versionCode = 49', 'versionCode')
          g = replace_once(g, 'versionName = "0.8.1-dev.6"', 'versionName = "0.8.1-dev.7"', 'versionName')
          gradle.write_text(g)

          Path('.github/workflows/refine-update-restart-detection.yml').unlink()
          PY

      - name: Commit changes
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt app/build.gradle.kts .github/workflows/refine-update-restart-detection.yml
          git commit -m "fix: detect upgrade install before restart notice"
          git push origin HEAD:dev
