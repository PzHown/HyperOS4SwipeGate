name: Refine update restart detection

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/refine-update-restart-detection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply refinement
        run: python3 scripts/refine_update_restart.py
      - name: Commit changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/pzhown/hyperos4swipegate/HomeScreen.kt app/build.gradle.kts scripts/refine_update_restart.py .github/workflows/refine-update-restart-detection.yml
          git commit -m "fix: detect upgrade install before restart notice"
          git push origin HEAD:dev
