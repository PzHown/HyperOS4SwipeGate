name: Rewrite release notes

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/rewrite-release-notes.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite formal release notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );

            const notes = {
              '0.7.1': [
                '适配新版 HyperOS 4 系统桌面',
                '优化侧滑触发与阈值设置体验',
                '提升模块状态检测与运行稳定性',
                '修复已知问题并优化整体体验',
              ],
              '0.7.0': [
                '新增新版系统桌面兼容支持',
                '支持自定义侧边栏触发阈值',
                '优化模块状态反馈与设置体验',
                '提升稳定性并修复已知问题',
              ],
              '0.6.0': [
                '增强新版 HyperOS 4 桌面兼容性',
                '优化侧滑触发与阈值调节',
                '改进模块状态反馈与运行稳定性',
                '修复已知问题并优化使用体验',
              ],
              '0.5.0': [
                '优化新版系统桌面适配',
                '改进侧滑触发判定体验',
                '提升模块加载与运行稳定性',
                '修复已知问题并优化细节',
              ],
              '0.4.0': [
                '优化 HyperOS 4 系统桌面适配',
                '完善侧边栏触发阈值设置',
                '改进侧滑判定稳定性',
                '修复已知问题并优化体验',
              ],
            };

            const fallback = [
              '优化 HyperOS 4 系统桌面兼容性',
              '改进侧滑判定与使用体验',
              '提升模块运行稳定性',
              '修复已知问题并优化细节',
            ];

            let updated = 0;
            for (const release of releases) {
              if (release.draft || release.prerelease) continue;

              const match = (release.name || release.tag_name || '').match(/v?(\d+\.\d+\.\d+)/);
              const version = match ? match[1] : '';
              const lines = notes[version] || fallback;
              const body = lines.map((line, index) => `${index + 1}. ${line}`).join('\n');

              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                body,
              });
              updated += 1;
              core.info(`Updated ${release.tag_name} (${version || 'unknown'})`);
            }

            core.info(`Updated ${updated} formal releases.`);
