name: Run back progress scale patch

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/apply_back_progress_scale.py'
      - '.github/workflows/run-back-progress-scale.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply progress scale patch
        run: python3 scripts/apply_back_progress_scale.py
      - name: Verify source invariants
        run: |
          grep -q 'PROGRESS_V1 convert_offset hook ready' native/src/main.cpp
          grep -q 'progressScale=%.4f' native/src/main.cpp
          grep -q 'versionName = "0.8.2-beta2"' app/build.gradle.kts
          test ! -e scripts/apply_back_progress_scale.py
          test ! -e .github/workflows/run-back-progress-scale.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align Back progress with custom threshold'
          git push origin HEAD:dev
