name: Run HyperRT caller trace patch

on:
  push:
    branches: [dev]
    paths:
      - scripts/apply_haptic_caller_trace.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply haptic caller trace patch
        run: python3 scripts/apply_haptic_caller_trace.py
      - name: Verify source invariants
        run: |
          grep -F 'HAPTIC_TRACE stock-call' native/src/main.cpp
          grep -F '__builtin_return_address(0)' native/src/main.cpp
          grep -F 'versionCode = 59' app/build.gradle.kts
          ! grep -F 'scripts/apply_haptic_caller_trace.py' .github/workflows/run-haptic-caller-trace.yml || true
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'diag: capture real Launcher stock haptic caller'
          git push origin dev
