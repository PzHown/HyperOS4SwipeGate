name: Run HyperRT caller trace patch

on:
  push:
    branches: [dev]
    paths:
      - scripts/apply_haptic_caller_trace.py
      - .github/workflows/run-haptic-caller-trace.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply HyperRT caller trace patch
        run: python3 scripts/apply_haptic_caller_trace.py
      - name: Verify source invariants
        run: |
          grep -F 'HAPTIC_TRACE stock-call' native/src/main.cpp
          grep -F '__builtin_return_address(0)' native/src/main.cpp
          grep -F 'versionCode = 59' app/build.gradle.kts
          test ! -e scripts/apply_haptic_caller_trace.py
          test ! -e .github/workflows/run-haptic-caller-trace.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'diag: capture real HyperRT haptic caller on Launcher 8.x'
          git push origin HEAD:dev
