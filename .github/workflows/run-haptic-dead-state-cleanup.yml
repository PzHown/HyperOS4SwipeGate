name: Run haptic dead-state cleanup

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/run-haptic-dead-state-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Apply dead-state cleanup
        run: python3 scripts/apply_haptic_dead_state_cleanup.py
      - name: Verify convergence invariants
        run: |
          ! grep -R "gCapturedHapticArc\|gCapturedHapticArcAtMs\|gNativeHapticSuppressUntilMs\|gLastInjectedHapticAtMs" native/src/main.cpp
          ! grep -R "HAPTIC_TRACE stock-call\|traceStockHapticCall" native/src/main.cpp
          grep -q "HAPTIC_V2 release suppressed reason=ready-release-callsite" native/src/main.cpp
          grep -q "HAPTIC_V2 release preserved reason=callsite-window" native/src/main.cpp
          grep -q "kReadyReleaseDedupMs = 750" native/src/main.cpp
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove obsolete haptic capture state"
          git push origin HEAD:dev
