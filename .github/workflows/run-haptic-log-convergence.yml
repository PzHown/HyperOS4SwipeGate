name: Run haptic log convergence

# One-shot production cleanup after dev.18 runtime validation.
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/run-haptic-log-convergence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Apply haptic log convergence
        run: python3 scripts/apply_haptic_log_convergence.py
      - name: Verify production trace convergence
        run: |
          ! grep -R "HAPTIC_TRACE stock-call\|traceStockHapticCall\|gHapticTraceSequence\|SYS_gettid" native/src/main.cpp
          grep -q "HAPTIC_V2 release suppressed reason=ready-release-callsite" native/src/main.cpp
          grep -q "HAPTIC_V2 release preserved reason=callsite-window" native/src/main.cpp
          grep -q "HAPTIC_V2 release callsite ready" native/src/main.cpp
          grep -q 'versionCode = 61' app/build.gradle.kts
          grep -q 'versionName = "0.8.1-dev.19"' app/build.gradle.kts
      - name: Commit convergence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: converge haptic release diagnostics"
          git push origin HEAD:dev
