name: Run haptic production cleanup

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/apply_haptic_production_cleanup.py'
      - '.github/workflows/run-haptic-production-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply production cleanup
        run: python3 scripts/apply_haptic_production_cleanup.py
      - name: Verify cleanup
        run: |
          ! grep -R "HAPTIC_TRACE\|traceStockHapticCall\|gHapticTraceSequence\|SYS_gettid" native/src/main.cpp
          grep -q "HAPTIC_V2 release suppressed reason=ready-release-callsite" native/src/main.cpp
          grep -q "HAPTIC_V2 release preserved reason=callsite-window" native/src/main.cpp
          grep -q "versionCode = 61" app/build.gradle.kts
          grep -q 'versionName = "0.8.1-dev.19"' app/build.gradle.kts
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: converge haptic release dedup for production"
          git push origin HEAD:dev
