name: Run haptic trace convergence

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/apply_haptic_trace_convergence.py'
      - '.github/workflows/run-haptic-trace-convergence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply convergence patch
        run: python3 scripts/apply_haptic_trace_convergence.py
      - name: Verify source invariants
        run: |
          ! grep -R "HAPTIC_TRACE stock-call\|traceStockHapticCall\|gHapticTraceSequence\|SYS_gettid" native/src/main.cpp
          grep -q "HAPTIC_V2 release callsite ready" native/src/main.cpp
          grep -q "ready-release-callsite" native/src/main.cpp
          grep -q 'versionCode = 61' app/build.gradle.kts
          grep -q 'versionName = "0.8.1-dev.19"' app/build.gradle.kts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: converge release haptic dedup' || exit 0
          git push origin HEAD:dev
