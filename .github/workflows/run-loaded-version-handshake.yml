name: Run loaded-version handshake patch

on:
  push:
    branches: [dev]
    paths:
      - scripts/apply_loaded_version_handshake.py
      - .github/workflows/run-loaded-version-handshake.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_loaded_version_handshake.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'swipeGateVersionCode = 57' app/build.gradle.kts
          grep -q 'versionName = "0.8.1-dev.15"' app/build.gradle.kts
          grep -q 'SWIPEGATE_VERSION_CODE' native/CMakeLists.txt
          grep -q 'swipegate_native_module_version' native/src/control_channel.cpp
          grep -q 'EXTRA_SYSTEMUI_MODULE_VERSION' app/src/main/java/io/github/pzhown/hyperos4swipegate/SystemUiBridgeModule.java
          grep -q 'runtimeVersionStale' app/src/main/java/io/github/pzhown/hyperos4swipegate/XposedServiceBridge.java
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: detect stale scope by loaded module version"
          git push origin HEAD:dev
