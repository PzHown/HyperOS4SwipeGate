name: Run release-boundary haptic dedup patch

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/run-release-boundary-dedup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply release-boundary patch
        run: python3 scripts/apply_release_boundary_dedup.py
      - name: Verify source invariants
        run: |
          grep -q 'release-ready-state-back-v1' native/src/main.cpp
          grep -q 'reason=ready-release-boundary' native/src/main.cpp
          grep -q 'semantic=READY_STATE_BACK' native/src/main.cpp
          grep -q 'versionCode = 58' app/build.gradle.kts
          ! grep -R 'gReleaseDedupTokenDeadlineMs\|gSwipeGateOriginalOnBackInvoke\|installBackInvokeHapticHook' native/src/main.cpp native/src/swipe_hook_entry.S
      - name: Commit patch
        run: |
          rm -f .github/workflows/run-release-boundary-dedup.yml scripts/apply_release_boundary_dedup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: dedup stock release haptic at Launcher 8.x boundary'
          git push origin HEAD:dev
