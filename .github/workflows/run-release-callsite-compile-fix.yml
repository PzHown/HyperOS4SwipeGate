name: Run release callsite compile fix

on:
  push:
    branches: [dev]
    paths:
      - scripts/apply_release_callsite_compile_fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply compile fix
        run: python3 scripts/apply_release_callsite_compile_fix.py
      - name: Verify
        run: |
          grep -F 'const uintptr_t callsite = callerReturnAddress >= 4u' native/src/main.cpp
          grep -F 'versionCode = 60' app/build.gradle.kts
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: derive release callsite inside haptic hook'
          git push origin dev
