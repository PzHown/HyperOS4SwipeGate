name: Run release callsite fix

on:
  push:
    branches: [dev]
    paths:
      - scripts/apply_release_callsite_fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply release callsite fix
        run: python3 scripts/apply_release_callsite_fix.py
      - name: Verify source invariants
        run: |
          grep -F 'stock-back-release-haptic-v1' native/src/main.cpp
          grep -F 'reason=ready-release-callsite' native/src/main.cpp
          grep -F 'versionCode = 60' app/build.gradle.kts
          ! grep -F 'gReleaseFeedbackScopeArmed' native/src/main.cpp
          ! grep -F 'installReleaseFeedbackHapticHook' native/src/main.cpp
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: dedup real Launcher release haptic callsite'
          git push origin dev
