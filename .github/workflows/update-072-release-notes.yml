name: Update 0.7.2 release notes

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/update-072-release-notes.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update repository release notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag: '34-0.7.2' });
            const body = [
              '1. 修复部分设备模块状态回包超时问题',
              '2. 修复状态通道异常被误显示为 Native Hook 失败',
              '3. 优化模块状态诊断与问题定位',
              '4. 提升运行稳定性并优化整体体验',
            ].join('\n');
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.data.id, body });

      - name: Update LSPosed prerelease notes
        env:
          GH_TOKEN: ${{ secrets.LSPOSED_REPO_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh release edit "34-0.7.2" \
              --repo "Xposed-Modules-Repo/io.github.pzhown.hyperos4swipegate" \
              --notes $'1. 修复部分设备模块状态回包超时问题\n2. 修复状态通道异常被误显示为 Native Hook 失败\n3. 优化模块状态诊断与问题定位\n4. 提升运行稳定性并优化整体体验' \
              --prerelease
          fi
